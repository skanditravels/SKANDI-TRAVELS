<div class="sfo-surface">
  <header class="app-header">
    <div class="app-header-inner">
      <div><span class="brand-word">SKANDI</span><span class="brand-group">GROUP</span></div>
      <div class="header-description">People &amp; Culture &nbsp; / &nbsp; Employment offer</div>

  <main class="workspace">
    <aside class="editor" aria-labelledby="sfo-editor-title">

        <div class="eyebrow">New York employment</div>

        <p>Enter the hiring details to create a letter for your candidate.</p>
        <div class="notice">Complete every required field before printing or downloading the letter.</div>

        <fieldset>

            <div class="field wide"><label for="sfo-candidate-full">Candidate full name <span class="required-mark">*</span></label><input id="sfo-candidate-full" name="candidate_full_name" required placeholder="First and last name"></div>
            <div class="field wide"><label for="sfo-employer">Legal employer name <span class="required-mark">*</span></label><input id="sfo-employer" name="legal_employer" required placeholder="Full registered legal name"></div>
            <div class="field wide"><label for="sfo-brand">Operating branch <span class="field-note">(optional)</span></label><select id="sfo-brand" name="operating_brand"><option value="">No separate operating name</option><option value="SKANDI Group">SKANDI Group</option><option value="SKANDI Travels">SKANDI Travels</option></select><p class="field-note">Select the applicable brand, if different from the legal employer.</p></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>Position and schedule</legend>
          <div class="fields">
            <div class="field wide"><label for="sfo-job-title">Job title <span class="required-mark">*</span></label><input id="sfo-job-title" name="job_title" required placeholder="Position title"></div>
            <div class="field"><label for="sfo-department">Department <span class="required-mark">*</span></label><input id="sfo-department" name="department" required placeholder="Department"></div>

            <div class="field wide"><label for="sfo-work-location">Work location <span class="required-mark">*</span></label><input id="sfo-work-location" name="work_location" required placeholder="Primary worksite or remote arrangement"></div>
            <div class="field wide"><label for="sfo-schedule">Expected schedule <span class="required-mark">*</span></label><input id="sfo-schedule" name="schedule" required placeholder="Days, hours and expected hours per week"></div>
            <div class="field wide"><label for="sfo-travel">Required travel <span class="required-mark">*</span></label><input id="sfo-travel" name="travel" required placeholder="Travel requirements or None"></div>
            <div class="field wide"><label for="sfo-responsibilities">Principal responsibilities <span class="required-mark">*</span></label><textarea id="sfo-responsibilities" name="responsibilities" required placeholder="Briefly describe the role and its main responsibilities."></textarea></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>Compensation and benefits</legend>
          <div class="fields">

        </fieldset>

          <p class="status" id="sfo-form-status" role="status" aria-live="polite"></p>
