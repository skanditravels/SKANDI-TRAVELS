<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotels | SKANDI Travels</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="../shared/skandi-travel-discovery.css">
  <link rel="stylesheet" href="skandi-hotel-list.css">
</head>
<body>
  <main class="sj-page hs-page" id="hotelListApp" aria-busy="true">
    <div class="sj-shell">
      <div class="sj-top">
        <nav class="sj-breadcrumb" id="hotelBreadcrumb" aria-label="Breadcrumb">
          <a href="https://www.skanditravels.com/destinations" target="_top" data-path="/destinations">Destinations</a>
        </nav>
      </div>
      <header class="sj-hero" aria-labelledby="hotelTitle">
        <div class="sj-hero-copy">
          <p class="sj-context" id="hotelLocation" hidden></p>
          <h1 id="hotelTitle">Hotels</h1>
          <p id="hotelIntro" hidden></p>
          <div class="sj-actions" id="hotelHeroActions" hidden>
            <button class="sj-button primary" id="hotelAvailabilityLink" type="button" hidden>Check availability</button>
            <p id="hotelUnavailable" class="hs-unavailable" hidden>Online booking is unavailable for this hotel.</p>
          </div>
        </div>
        <div class="sj-visual" id="hotelVisual" hidden><img id="hotelHeroImage" alt=""></div>
      </header>
      <div class="sj-status" role="status" id="hotelStatus">Loading hotels…</div>
      <button class="sj-button" id="hotelRetry" type="button" hidden>Try again</button>
      <section id="hotelContent" hidden>
        <details class="hs-booking" id="hotelBooking">
          <summary>Check dates and availability</summary>
          <form id="hotelBookingForm">
            <div class="hs-fields">
              <label id="hotelPropertyField">Hotel<select id="hotelProperty"></select></label>
              <label>Check-in<input type="date" name="checkInDate" required></label>
              <label>Check-out<input type="date" name="checkOutDate" required></label>
              <label>Adults<input type="number" name="adults" min="1" max="9" value="2" required></label>
              <label>Children &amp; infants<input type="number" name="children" min="0" max="8" value="0" required></label>
              <label>Rooms<input type="number" name="rooms" min="1" max="9" value="1" required></label>
            </div>
            <div class="hs-fields" id="hotelChildAges"></div>
            <label class="hs-check" id="hotelFlightsField"><input type="checkbox" name="addFlights"> Add flights</label>
            <label id="hotelOriginField" hidden>Flying from<select name="originIata"></select></label>
            <button class="sj-button primary" id="hotelBook" type="submit">Check availability</button>
          </form>
        </details>
        <div id="hotelDirectory">
          <div class="hs-filters">
            <label>Find a hotel<input id="hotelFilter" type="search" placeholder="Hotel or location"></label>
            <label>Sort by<select id="hotelSort"><option value="recommended">Recommended</option><option value="name">Hotel name</option><option value="rating">Guest rating</option></select></label>
          </div>
          <p id="hotelCount" role="status"></p>
          <div class="sj-grid" id="hotelCards"></div>
        </div>
        <article id="hotelDetail" class="hs-detail" hidden>
          <nav id="hotelSections" class="sj-controls" aria-label="Hotel information"></nav>
          <div id="hotelPanels"></div>
        </article>
      </section>
    </div>
  </main>
  <script src="skandi-hotel-list.js"></script>
</body>
</html>
