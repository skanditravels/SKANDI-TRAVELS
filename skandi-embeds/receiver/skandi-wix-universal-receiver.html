<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SKANDI | Loading</title>
<style>
:root { color-scheme:dark; --navy:#022e64; --aqua:#5fc7cf; }
* { box-sizing:border-box; }
html,body { width:100%; min-height:100%; margin:0; }
body { font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
#skandi-receiver-status {
  position:relative; isolation:isolate; display:grid; place-items:center;
  width:100%; min-height:100vh; min-height:100svh; padding:24px;
  overflow:hidden; color:#f7fbff;
  background:radial-gradient(ellipse 50% 33% at 50% 49%,rgba(33,116,160,.13),transparent 100%),linear-gradient(160deg,#041d3b 0%,#022e64 55%,#03244a 100%);
}
.skandi-wave-stage { position:relative; width:min(530px,88vw); padding:0; }
#skandi-wave-svg { display:block; width:100%; height:auto; overflow:visible; filter:drop-shadow(0 10px 12px rgba(0,10,38,.12)); }
.skandi-wave-bands { transform-origin:center; }


.skandi-wave-stage {position:relative;width:min(620px,96vw);padding:0;aspect-ratio: 375 / 100;}
.skandi-wave-master,.skandi-wave-motion {position:absolute;display:block;width:100%;height:75%;top:12.5%;left:0}
.skandi-wave-motion {height:100%;top:0;opacity:0}
.skandi-wave-stage.is-animated .skandi-wave-motion {opacity:1}
.skandi-wave-stage.is-animated .skandi-wave-master {visibility:hidden}

.skandi-sr-only {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skandi-error {width:min(100%,430px);text-align:center}
.skandi-error h1 {margin:0 0 12px;font-size:21px;line-height:1.3;font-weight:600}
.skandi-error p {margin:0 0 22px;color:#cbdbea;font-size:14px}
.skandi-error button {min-height:44px;padding:11px 24px;border:1px solid var(--aqua);border-radius:7px;background:var(--aqua);color:#032b49;font:inherit;font-weight:650;cursor:pointer}
.skandi-error button:focus-visible {outline:3px solid #fff;outline-offset:3px}
[hidden] {display:none!important}
@media(max-width:480px) { .skandi-wave-stage {width:min(340px,86vw)} }
@media(prefers-reduced-motion:reduce) { .skandi-wave-bands,.skandi-wave-stage::after {animation:none!important} }

#skandi-receiver-status {display:flex;flex-direction:column;justify-content:center;gap:0;text-align:center}
.skandi-loading-copy {margin:0;color:#edf6fb;font-size:15px;letter-spacing:.02em;font-weight:500}
.skandi-loading-dots {display:inline-flex;width:1.5em;justify-content:flex-start;gap:.18em;margin-left:.3em;vertical-align:middle}
.skandi-loading-dots i {width:4px;height:4px;border-radius:50%;background:#5fc7cf;animation:skandi-dot 1.25s ease-in-out infinite}
.skandi-loading-dots i:nth-child(2) {animation-delay:.16s}.skandi-loading-dots i:nth-child(3) {animation-delay:.32s}
@keyframes skandi-dot {0%,60%,100% {opacity:.3;transform:translateY(0)}30% {opacity:1;transform:translateY(-3px)}}
#skandi-receiver-status[data-state="error"] .skandi-wave-stage {width:min(340px,80vw);margin-bottom:12px}
.skandi-error {width:min(100%,420px)}
.skandi-error h1 {font-size:24px;letter-spacing:-.025em}
.skandi-error p {line-height:1.6;margin-bottom:17px}
.skandi-error-ref {display:block;margin:0 0 22px;color:#aac6d8;font-size:12px;letter-spacing:.025em;overflow-wrap:anywhere}
.skandi-error button {min-width:142px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
@media(prefers-reduced-motion:reduce) {.skandi-loading-dots i {animation:none;opacity:1}}

</style>
</head>

      // actual silhouette curves and moves while its details remain aligned.
      for (let x=0; x<src.width; x+=3) {
        const u = x / src.width;
        const envelope = Math.pow(Math.sin(Math.PI*u), 1.4);
        const bend = 19 * envelope * Math.sin(2*Math.PI*(1.12*u-time/period));
        context.drawImage(src, x, 0, 3, src.height, x, 50+bend, 3.15, src.height);
      }
      stage.classList.add('is-animated');
      last=now;
    }
    frame=requestAnimationFrame(tick);
  }
  function sync() {
    cancelAnimationFrame(frame); frame=0;
    if (!ready || !stage.isConnected || stage.hidden || stage.closest('[data-state=error]') || document.hidden || motion.matches) {
      stage.classList.remove('is-animated');
      return;
    }
    start=null;last=0;frame=requestAnimationFrame(tick);
  }
  function load() {
    if (!img.naturalWidth) return;
    source.drawImage(img,0,0,src.width,src.height);
    ready=true;sync();
  }
  img.addEventListener('load',load,{once:true});
  if(img.complete)load();
  document.addEventListener('visibilitychange',sync);
  if(motion.addEventListener)motion.addEventListener('change',sync);
  else if(motion.addListener)motion.addListener(sync);
})();
</script>
<script>
(() => {
  'use strict';

  // This code is identical on every Wix HTML component. The owning Wix
  // masterPage controller supplies a verified page identity at runtime.
  const SOURCE = 'SKANDI_UNIVERSAL_RECEIVER';
  const PARENT = 'SKANDI_WIX_PARENT';
  const ORIGINS = new Set([
    'https://www.skanditravels.com',
    'https://skanditravels.com',
    'https://editor.wix.com',
    'https://skanditravels-my-site-2.editor.wix.com'
  ]);
  const ROOTS = [
    'https://raw.githubusercontent.com/skanditravels/SKANDI-TRAVELS/main/',
    'https://cdn.jsdelivr.net/gh/skanditravels/SKANDI-TRAVELS@main/'
  ];
  const MAX_REQUESTS = 40;
  const REQUEST_INTERVAL_MS = 500;
  const FETCH_TIMEOUT_MS = 12000;
  const nonce = Array.from(crypto.getRandomValues(new Uint32Array(4)), value => value.toString(16)).join('-');
  const screen = document.getElementById('skandi-receiver-status');
  const spinner = document.getElementById('skandi-loader-spinner');
  const label = document.getElementById('skandi-loader-label');
  const errorPanel = document.getElementById('skandi-loader-error');
  const errorMessage = document.getElementById('skandi-loader-message');
  const retry = document.getElementById('skandi-loader-retry');
  const reference = document.getElementById('skandi-loader-reference');

  let requests = 0;
  let loading = false;
  let done = false;
  let interval;

  function fail(code) {
    if (done) return;
    done = true;
    clearInterval(interval);
    window.removeEventListener('message', receive);
    screen.setAttribute('aria-busy', 'false');
    // Keep customer-facing copy free of technical details. The code and UTC
    // date support diagnosis; central log correlation still needs integration.
    screen.dataset.state = 'error';
    spinner.classList.remove('is-animated');
    label.hidden = true;
    const category = {STAFF_ACCESS:'01', CONNECTION:'02', PUBLISH:'03', LOADING:'04'}[code] || '04';
    const day = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const referenceId = 'SK-' + category + '-' + day + '-' + nonce.replace(/-/g, '').slice(0, 12).toUpperCase();
    reference.textContent = 'Error ID: ' + referenceId;
    errorPanel.hidden = false;
    console.error('[SKANDI page error]', {referenceId, code, occurredAt: new Date().toISOString()});
    document.title = 'SKANDI | Page unavailable';
  }

  async function get(url) {
    const abort = new AbortController();
    const timeout = setTimeout(() => abort.abort(), FETCH_TIMEOUT_MS);
    try {
      const response = await fetch(url, {
        mode: 'cors',
        credentials: 'omit',
        cache: 'no-store',
        signal: abort.signal
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return await response.text();
    } finally {
      clearTimeout(timeout);
    }
  }

  function validateIdentity(identity) {
    return identity && identity.allowed === true &&
      typeof identity.key === 'string' && identity.key.length > 0 && identity.key.length <= 120 &&
      typeof identity.route === 'string' && /^\/(?!\/)/.test(identity.route) &&
      typeof identity.embedId === 'string' && identity.embedId.startsWith('#') &&
      ['public', 'riaintra', 'altea'].includes(identity.family) &&
      ['none', 'public', 'riaintra', 'altea'].includes(identity.chrome);
  }

  async function resolve(root, identity) {
    const manifest = JSON.parse(await get(root + 'dist/manifest.json'));
    if (manifest.schemaVersion !== 2 || !Array.isArray(manifest.pages)) throw new Error('Invalid manifest');
    const matches = manifest.pages.filter(page => page.key === identity.key);
    if (matches.length !== 1) throw new Error('Missing or ambiguous page');
    const page = matches[0];
    if (page.status !== 'BUILT' || page.route !== identity.route ||
        page.family !== identity.family || page.chrome !== identity.chrome) {
      throw new Error('Mismatched build identity');
    }
    if (page.requiresStaff && identity.staffAuthorized !== true) throw new Error('Staff access required');
    if (!/^[a-z0-9-]+$/.test(page.slug) || page.output !== 'dist/' + page.slug + '/index.html') {
      throw new Error('Invalid compiled output path');
    }
    if (!/^[a-f0-9]{64}$/.test(page.sha256)) throw new Error('Invalid checksum');

    const html = await get(root + page.output);
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(html));
    const actual = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
    if (actual !== page.sha256) throw new Error('Checksum mismatch');

    const parsed = new DOMParser().parseFromString(html, 'text/html');
    const shell = parsed.getElementById('skandi-shell-root');
    const frames = [...parsed.querySelectorAll('iframe')];
    const allowedVoyFallback = identity.key === 'voy' && frames.length === 1 &&
      frames[0].id === 'fallbackFrame' && frames[0].getAttribute('class') === 'reader-fallback' &&
      frames[0].getAttribute('title') === 'VOY PDF fallback reader' &&
      !frames[0].hasAttribute('src') && !frames[0].hasAttribute('srcdoc') &&
      !frames[0].hasAttribute('name') && !frames[0].hasChildNodes();
    const allowedCareerViewer = identity.key === 'careers' && frames.length === 1 &&
      frames[0].id === 'pdfViewer' && frames[0].getAttribute('title') === 'Applicant document viewer' &&
      frames[0].getAttribute('src') === 'about:blank' &&
      [...frames[0].attributes].every(attribute => ['id','title','src'].includes(attribute.name)) &&
      !frames[0].hasChildNodes();
    if (!/^\s*<!doctype html>/i.test(html) || !shell ||
        shell.dataset.skandiKey !== identity.key ||
        shell.dataset.skandiFamily !== identity.family ||
        shell.dataset.skandiChrome !== identity.chrome ||
        (frames.length && !allowedVoyFallback && !allowedCareerViewer)) {
      throw new Error('Invalid compiled page');
    }
    return html;
  }

  async function receive(event) {
    if (done || loading || event.source !== window.parent || !ORIGINS.has(event.origin)) return;
    let message = event.data;
    if (typeof message === 'string') {
      try { message = JSON.parse(message); } catch { return; }
    }
    if (message?.source !== PARENT || message.type !== 'SKANDI_MASTER_CONFIG' ||
        message.payload?.receiverRequestId !== nonce) return;

    const identity = message.payload.compiledPage;
    if (!validateIdentity(identity)) {
      const denied = /authorized staff session/i.test(String(identity?.reason || ''));
      fail(denied ? 'STAFF_ACCESS' : 'CONNECTION');
      return;
    }

    loading = true;
    clearInterval(interval);
    let html = null;
    for (const root of ROOTS) {
      try {
        html = await resolve(root, identity);
        break;
      } catch (error) {
        console.warn('[SKANDI receiver] Published page resolution failed:', error?.message || error);
      }
    }
    if (!html) { fail('PUBLISH'); return; }

    done = true;
    window.removeEventListener('message', receive);
    window.__SKANDI_RECEIVER_CONTEXT__ = Object.freeze({ ...identity });
    document.open();
    document.write(html);
    document.close();
  }

  function request() {
    if (done || loading) return;
    if (++requests > MAX_REQUESTS) { fail('CONNECTION'); return; }
    window.parent.postMessage({
      source: SOURCE,
      type: 'MASTER_CONFIG_REQUEST',
      payload: { receiverProtocol: 1, receiverRequestId: nonce }
    }, '*');
  }

  retry.addEventListener('click', () => window.location.reload());
  window.addEventListener('message', receive);
  interval = setInterval(request, REQUEST_INTERVAL_MS);
  request();
})();
</script>
</body>
