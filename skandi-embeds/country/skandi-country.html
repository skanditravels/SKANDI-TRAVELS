<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Explore Destinations | SKANDI Travels</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="../shared/skandi-travel-discovery.css">
  <link rel="stylesheet" href="skandi-country.css">
  <link rel="stylesheet" href="skandi-country.part-02.css">
  <link rel="stylesheet" href="skandi-country.part-03.css">
</head>
<body>
  <main class="sj-page country-page" id="countryPage" aria-busy="true">
    <div class="sj-shell">
      <div class="sj-top">
        <nav class="sj-breadcrumb" id="countryBreadcrumb" aria-label="Breadcrumb">
          <a href="https://www.skanditravels.com/destinations" target="_top" data-nav="/destinations" data-i18n="country.destinations">Destinations</a>
        </nav>
        <label class="country-picker"><span data-i18n="country.choose">Choose country</span><select id="countrySelector"></select></label>
      </div>
      <div id="countryStatus" class="sj-status country-status" role="status">
        <span id="countryStatusText">Loading destination information…</span>
        <button type="button" id="countryRetry" class="sj-button" hidden>Retry</button>
      </div>
      <div id="countryMain" hidden>
        <header class="sj-hero" aria-labelledby="heroTitle">
          <div class="sj-hero-copy">
            <p class="sj-context" id="heroKicker" hidden></p>
            <h1 id="heroTitle"></h1>
            <p id="heroSummary"></p>
            <div class="sj-actions">
              <button class="sj-button primary" data-i18n="country.hotels" id="hotelBtn" type="button">Find hotels</button>
              <button class="sj-button" data-i18n="country.plan" id="planBtn" type="button">Plan your trip</button>
              <button class="sj-button" data-i18n="country.gallery" id="galleryBtn" type="button">View gallery</button>
            </div>
          </div>
          <div class="sj-visual" id="countryVisual" hidden>
            <img alt="" id="hero1">
          </div>
        </header>
        <nav class="sj-controls" id="countryViews" aria-label="Destination information">
          <button type="button" data-view="overview" aria-pressed="true" data-i18n="country.nav.overview">Overview</button>
          <button type="button" data-view="deals" aria-pressed="false" data-i18n="country.nav.deals">Trips &amp; prices</button>
          <button type="button" data-view="info" aria-pressed="false" data-i18n="country.nav.info">Travel information</button>
        </nav>
        <div id="countryOverview" class="country-content">
          <section id="regions" aria-labelledby="regionsTitle">
            <h2 class="sj-heading" id="regionsTitle" data-i18n="country.section.stay">Discover where to stay</h2>
            <div class="sj-grid" id="regionGrid"></div>
          </section>
          <section id="countryAbout" class="sj-section" aria-labelledby="introTitle">
            <h2 class="sj-heading" id="introTitle" data-i18n="country.section.guide">The SKANDI guide</h2>
            <div class="country-facts" id="facts"></div>
            <div class="country-description" id="introCopy"></div>
            <div class="country-description" id="signatureCopy"></div>
            <div id="storyGrid"></div>
          </section>
        </div>
        <section class="sj-section country-content" id="deals" aria-labelledby="dealsTitle" hidden>
          <h2 class="sj-heading" id="dealsTitle"></h2>
          <form id="searchForm">
            <div class="search-grid">
              <label class="search-field"><span data-i18n="country.search.from">Flying from</span><input data-i18n-placeholder="country.search.fromPh" id="origin" list="countryOrigins" required autocomplete="off" placeholder="City or airport"></label>
              <datalist id="countryOrigins"></datalist>
              <label class="search-field"><span id="arrivalLabel">Flying to</span><select id="arrival" required></select></label>
              <label class="search-field"><span data-i18n="country.search.depart">Departure</span><input id="depart" type="date" required></label>
              <label class="search-field"><span data-i18n="country.search.return">Return</span><input id="return" type="date" required></label>
              <label class="search-field"><span data-i18n="country.search.travelers">Travellers</span><select id="travelers"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></label>
              <button class="sj-button primary" id="searchButton" type="submit" data-i18n="country.search.button">Search trips</button>
            </div>
          </form>
          <div class="offer-status" id="offerStatus" role="status"></div>
          <div class="sj-grid" id="offerGrid"></div>
        </section>
        <div id="countryInfo" class="country-content" hidden>
          <section id="travelInfo" class="sj-section" aria-labelledby="infoTitle">
            <h2 class="sj-heading" id="infoTitle" data-i18n="country.section.good">Good to know before you travel</h2>
            <div class="sj-grid" id="infoGrid"></div>
          </section>
          <section id="weather" class="sj-section" aria-labelledby="weatherTitle">
            <h2 class="sj-heading" id="weatherTitle" data-i18n="country.section.weather">Weather &amp; best time to travel</h2>
            <p id="weatherCopy"></p>
            <div class="climate" id="climate"></div>
          </section>
          <section id="airlineInfo" class="sj-section" aria-labelledby="airlineTitle">
            <h2 class="sj-heading" id="airlineTitle" data-i18n="country.section.airlines">Airline options</h2>
            <div class="sj-grid" id="airlineGrid"></div>
          </section>
          <section id="inspiration" class="sj-section" aria-labelledby="inspireTitle">
            <h2 class="sj-heading" id="inspireTitle" data-i18n="country.section.inspire">Travel ideas &amp; inspiration</h2>
            <div class="sj-grid" id="inspireGrid"></div>
          </section>
          <section id="faq" class="sj-section" aria-labelledby="faqTitle">
            <h2 class="sj-heading" id="faqTitle" data-i18n="country.section.faq">Frequently asked questions</h2>
            <div id="faqList"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <dialog class="gallery-modal" id="galleryModal" aria-labelledby="galleryTitle">
    <div class="gallery-head"><strong id="galleryTitle"></strong><button aria-label="Close" class="sj-button" data-i18n-aria-label="country.close" id="galleryClose" type="button">×</button></div>
    <div class="gallery-stage"><img alt="" id="galleryMain"></div>
    <div class="gallery-thumbs" id="galleryThumbs"></div>
  </dialog>
  <script src="skandi-country.js"></script>
</body>
</html>
