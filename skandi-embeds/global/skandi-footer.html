<footer id="skandi-customer-footer" aria-label="SKANDI footer">
  <div class="skf-newsletter">
    <div class="skf-newsletter-copy">
      <h2 id="skf-newsletter-heading">Travel inspiration from SKANDI</h2>
      <p id="skf-newsletter-description">Subscribe to destination news and travel offers.</p>
    </div>
    <form id="skf-newsletter-form">
      <label for="skf-newsletter-email" class="skf-visually-hidden">Email address</label>
      <input type="email" id="skf-newsletter-email" placeholder="Your email address" autocomplete="email" required>
      <button type="submit" id="skf-newsletter-button">Subscribe</button>
    </form>
    <p id="skf-newsletter-result" class="skf-newsletter-status" role="status" aria-live="polite"></p>
  </div>
  <div class="skf-main">
    <div class="skf-brand">
      <img id="skf-logo" data-master-logo="customerFooter" alt="SKANDI Travels" hidden>
      <p id="skf-slogan"></p>
      <div id="skf-social-links" class="skf-social"></div>
      <div class="skf-wave-row">
        <img id="skf-wave" data-master-logo="skandiWave" alt="SKANDI Travels wave" hidden>
      </div>
    </div>
    <div id="skf-columns" class="skf-columns"></div>
  </div>
  <div class="skf-terms" id="skf-terms"></div>
  <div class="skf-bottom">
    <span>© <span id="skf-year"></span> SKANDI GROUP Inc. (United States) &amp; SKANDI GROUP Aktiebolag (Sweden). All rights reserved. SKANDI TRAVELS™ is a trademark of the SKANDI GROUP.</span>
    <div id="skf-legal-links" class="skf-legal-links"></div>
      <img id="skf-group-mark" data-master-logo="groupFooter" alt="SKANDI GROUP" hidden>
  </div>
</footer>
