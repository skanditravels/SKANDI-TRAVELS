<!doctype html>
<!-- V12 DATA AUTHORITY: Duffel provider facts are curated/persisted through Inventory Control + Supabase before this public consumer receives them. This embed owns no duplicate reference data. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a30">
<title>Travel Info | SKANDI Travels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skandi-travel-info.css" id="tiAirportFlightInfoStyles">

</head>
<body>
<div id="tiLive" class="ti-visually-hidden" aria-live="polite"></div>

<section id="tiHome" class="ti-home" aria-label="SKANDI Travel Info">
  <header class="ti-find">
    <div class="ti-wrap ti-find-inner">
      <h1>Travel Info</h1>
      <p>Find answers about your airline, airport, hotel and every stage of your trip.</p>
      <form id="tiHeroSearchForm" class="ti-find-search" role="search" autocomplete="off">
        <span id="tiHeroSearchIcon" data-icon="search" aria-hidden="true"></span>
        <label class="ti-visually-hidden" for="tiHeroSearch">Search Travel Info</label>
        <input id="tiHeroSearch" type="search" placeholder="Search JFK or baggage" enterkeyhint="search" autocomplete="off">
        <button class="ti-btn ti-btn-aqua" type="submit" aria-label="Search Travel Info"><span>Search</span><span id="tiSearchArrow" data-icon="arrow" aria-hidden="true"></span></button>
      </form>
      <div class="ti-find-tools" aria-label="Travel tools">
        <button type="button" data-action="baggage"><span data-icon="bag"></span>Baggage allowance</button>
        <button type="button" data-action="requirements"><span data-icon="passport"></span>Passport &amp; entry requirements</button>
        <button type="button" data-action="assistance"><span data-icon="help"></span>Special assistance</button>
        <button type="button" data-action="insurance"><span data-icon="ticket"></span>Travel insurance</button>
      </div>
      <div id="tiStatus" class="ti-atlas-status" role="status" hidden></div>
    </div>
  </header>

  <main>
    <section id="tiDirectory" class="ti-guide-directory ti-wrap" aria-labelledby="tiDirectoryHeading">
      <div id="tiFilterTabs" class="ti-guide-filter" role="group" aria-label="Information categories"></div>
      <div class="ti-guide-directory-head">
        <h2 id="tiDirectoryHeading" tabindex="-1">Travel help</h2>
        <div class="ti-guide-directory-options">
          <label id="tiJourneyFilterWrap">Trip stage <select id="tiJourneyFilter"></select></label>
          <span id="tiResultCount" aria-live="polite"></span>
        </div>
      </div>
      <div id="tiDirectoryList" class="ti-guide-results"></div>
      <div id="tiLoadMoreWrap" class="ti-load-more" hidden><button id="tiLoadMore" class="ti-btn ti-btn-light" type="button">Show more</button></div>
    </section>

    <section class="ti-wrap ti-guide-help" aria-labelledby="tiSupportHeading">
      <h2 id="tiSupportHeading">Need help with your trip?</h2>
      <div>
        <button class="ti-btn ti-btn-light" type="button" data-action="alexandra"><span data-icon="spark"></span>Ask Alexandra</button>
        <button class="ti-btn ti-btn-primary" type="button" data-action="support"><span data-icon="message"></span>Contact support</button>
      </div>
    </section>
  </main>
</section>

<section id="tiDetail" class="ti-detail-view" data-active="false" aria-label="Travel Info detail">
  <div class="ti-wrap">
    <div class="ti-backbar"><button id="tiBack" class="ti-back-btn" type="button"><span data-icon="back"></span>Back to Travel Info</button></div>
    <div id="tiDetailMount"></div>
  </div>
</section>

<div id="tiSearchLayer" class="ti-search-layer" data-open="false" aria-hidden="true">
  <button class="ti-scrim" type="button" data-close-search aria-label="Close search"></button>
  <section class="ti-search-shell" role="dialog" aria-modal="true" aria-labelledby="tiSearchDialogTitle">
    <h2 id="tiSearchDialogTitle" class="ti-visually-hidden">Search Travel Info</h2>
    <div class="ti-search-head">
      <span id="tiSearchDialogIcon" aria-hidden="true"></span>
      <label class="ti-visually-hidden" for="tiSearchInput">Search the SKANDI Travel Info library</label>
      <input id="tiSearchInput" type="search" placeholder="Search airline, airport, baggage, accessibility, passport..." autocomplete="off">
      <button class="ti-search-esc" type="button" data-close-search aria-label="Close search">Close</button>
    </div>
    <div id="tiSearchResults" class="ti-search-results"></div>
  </section>
</div>

<div id="tiOverlay" class="ti-overlay" data-open="false" aria-hidden="true">
  <button class="ti-scrim" type="button" data-close-overlay aria-label="Close panel"></button>
  <section id="tiSheet" class="ti-sheet" role="dialog" aria-modal="true" aria-labelledby="tiSheetTitle">
    <header class="ti-sheet-head">
      <div><div id="tiSheetKicker" class="ti-kicker ti-kicker-dark">Travel Info</div><h2 id="tiSheetTitle">Travel Info</h2><p id="tiSheetSubtitle"></p></div>
      <button id="tiSheetClose" class="ti-round-btn" type="button" data-close-overlay aria-label="Close panel"><span data-icon="close"></span></button>
    </header>
    <div id="tiSheetBody" class="ti-sheet-body"></div>
  </section>
</div>

<script src="skandi-travel-info.js"></script>


<script src="skandi-travel-info.part-02.js"></script>

<script type="importmap">{"imports":{"react":"https://esm.sh/react@19.3.0","react-dom/client":"https://esm.sh/react-dom@19.3.0/client?external=react","htm":"https://esm.sh/htm@3.1.1"}}</script>
<script type="module" src="skandi-travel-info.part-03.js"></script>
</body>
</html>
