<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022e64">
  <title>Destinations Map | SKANDI Travels</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script defer src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="skandi-destinations.css">
</head>
<body>
  <main class="network-app" id="networkApp">
    <section class="network-hero" id="networkHero" aria-labelledby="networkTitle">
      <div id="networkMap" aria-label="Interactive destinations map"></div>
      <div id="fallbackMap" class="fallback-map" role="region" aria-label="Overview map. Use arrow keys to pan and plus or minus to zoom." tabindex="0" hidden>
        <canvas aria-hidden="true"></canvas>
        <div id="fallbackPins"></div>
      </div>
      <span class="map-credit" id="fallbackCredit" hidden>Made with Natural Earth</span>
      <div class="map-interface">
        <header class="map-control-dock">
          <h1 id="networkTitle">Destinations map</h1>
          <div class="map-find">
            <button class="map-search-button" id="searchOpen" type="button" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.8-3.8"></path></svg>
              Search places or hotels
            </button>
            <button class="map-browse-button" id="browseOpen" type="button" aria-haspopup="dialog">Browse</button>
          </div>
          <div class="map-toolbar">
            <div class="mode-rail" id="modeRail" aria-label="Show on map">
              <button class="mode-btn active" type="button" data-mode="destinations" aria-pressed="true">Places</button>
              <button class="mode-btn" type="button" data-mode="collection" aria-pressed="false">Collection</button>
              <button class="mode-btn" type="button" data-mode="airlines" aria-pressed="false">Airlines</button>
            </div>
            <div class="region-strip" id="regionStrip"></div>
          </div>
        </header>
      </div>

      <div class="map-utilities" aria-label="Map controls">
        <div class="utility-stack">
          <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
          <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
          <button id="resetMap" type="button" aria-label="Reset map view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
          </button>
        </div>
        <details class="map-key">
          <summary>Map key</summary>
          <ul class="map-legend">
            <li><span class="legend-dot destination" aria-hidden="true"></span>Destination</li>
            <li><span class="legend-dot hotel" aria-hidden="true"></span>Collection hotel</li>
            <li><span class="legend-dot airport" aria-hidden="true"></span>Airport</li>
            <li><span class="legend-line" aria-hidden="true"></span>Partner route</li>
          </ul>
        </details>
      </div>

      <div class="map-tooltip" id="mapTooltip" role="tooltip"><strong></strong><span></span></div>

      <aside class="detail-panel" id="detailPanel" aria-label="Selected place" aria-hidden="true" inert>
        <button class="panel-close" id="panelClose" type="button" aria-label="Close selected place">×</button>
        <img class="panel-image" id="panelImage" alt="" hidden>
        <div class="panel-body" id="panelBody"></div>
      </aside>

      <section class="mobile-sheet" id="mobileSheet" data-snap="peek" aria-label="Selected place" aria-hidden="true" inert>
        <div class="sheet-tools">
          <button class="sheet-snap" id="sheetSnap" type="button" aria-label="Expand details">Expand</button>
          <button class="mobile-sheet-close" id="mobileSheetClose" type="button" aria-label="Close selected place">×</button>
        </div>
        <div class="mobile-sheet-content" id="mobileSheetContent"></div>
      </section>

      <div class="search-layer" id="searchLayer" aria-hidden="true" inert>
        <section class="search-panel" role="dialog" aria-modal="true" aria-labelledby="mapDialogTitle">
          <div class="search-head">
            <h2 id="mapDialogTitle">Find a place</h2>
            <button class="search-close" id="searchClose" type="button" aria-label="Close places">×</button>
          </div>
          <div class="search-tabs" aria-label="Find a place">
            <button id="switchSearch" type="button" aria-pressed="true">Search</button>
            <button id="switchBrowse" type="button" aria-pressed="false">Browse by country</button>
          </div>
          <div class="search-input-wrap" id="searchInputWrap">
            <label class="sr-only" for="networkSearch">Destination, hotel, airport or airline</label>
            <input class="search-input" id="networkSearch" type="search" autocomplete="off" placeholder="Destination, hotel, airport or airline">
          </div>
          <div class="search-body" id="searchResults"></div>
          <div class="search-body" id="directoryGrid" hidden></div>
        </section>
      </div>

      <div class="map-status" id="mapStatus" data-tone="info" hidden>
        <span id="mapStatusText" role="status"></span>
        <button id="mapRetry" type="button" hidden>Try again</button>
      </div>
      <div class="sr-only" id="selectionLive" aria-live="polite"></div>
    </section>
  </main>
  <script src="skandi-destinations-land.js"></script>
  <script src="skandi-destinations-fallback.js"></script>
  <script src="skandi-destinations.js"></script>
</body>
</html>
