<main class="expired-reset" aria-labelledby="expired-reset-title">
  <section class="expired-reset__panel" data-section-id="expired-reset-link-main">
    <div class="expired-reset__content">
      <div class="expired-reset__mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="22" stroke="currentColor" stroke-width="3"/>
          <path d="M32 19v14l9 5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="expired-reset__eyebrow" data-content-id="expired-reset-link-eyebrow">SKANDI CLUB · ACCOUNT RECOVERY</p>
      <h1 id="expired-reset-title" data-content-id="expired-reset-link-title">This link has expired</h1>
      <p class="expired-reset__lead" data-content-id="expired-reset-link-intro">Your password has not been changed.</p>
      <p class="expired-reset__detail" data-content-id="expired-reset-link-detail">This password reset link is no longer valid. Request a new link and follow the instructions in the email to choose a new password.</p>
      <div class="expired-reset__actions">
        <button class="expired-reset__button expired-reset__button--primary" type="button" data-action="reset" data-content-id="expired-reset-link-new-link">Send new link</button>
        <button class="expired-reset__button expired-reset__button--secondary" type="button" data-action="login" data-content-id="expired-reset-link-login">Log in</button>
        <button class="expired-reset__button expired-reset__button--back" type="button" data-action="back" data-content-id="expired-reset-link-back">Go back</button>
      </div>
      <p class="expired-reset__status" role="status" aria-live="polite"></p>
    </div>
    <div class="expired-reset__accent" aria-hidden="true"><span></span><span></span><span></span></div>
  </section>
</main>
