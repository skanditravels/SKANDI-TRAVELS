<style data-skandi-part="header">
#riaintra-global-header-root {
  --shell-h: 52px;
  --shell: #354a5f;
  --shell-hover: rgba(255, 255, 255, 0.14);
  --blue: #106ebe;
  --canvas: #ffffff;
  --text: #323130;
  --border: #edebe9;
  --font: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}

#riaintra-global-header-root * { box-sizing: border-box; }
#riaintra-global-header-root,#riaintra-global-header-root {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  color: var(--text);
  background: transparent;
  font-size: 14px;
  user-select: none;
}
#riaintra-global-header-root button { font: inherit; border: 0; background: transparent; color: inherit; cursor: pointer; }

/* Desktop Shellbar */
#riaintra-global-header-root .shellbar {
  position: fixed;
  inset: 0 0 auto;
  height: var(--shell-h);
  background: var(--shell);
  color: #fff;
  z-index: 1000;
  box-shadow: 0 1px 2px rgba(34, 54, 73, 0.12);
}
#riaintra-global-header-root .shellbar-inner {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  gap: 12px;
}
#riaintra-global-header-root .shell-left, #riaintra-global-header-root .shell-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

/* Branding */
#riaintra-global-header-root .product {
  display: flex;
  align-items: center;
  gap: 10px;
}
#riaintra-global-header-root .product img {
  height: 30px;
  width: auto;
  object-fit: contain;
  border-radius: 3px;
  display: none;
}
#riaintra-global-header-root .product img[src] {
  display: block;
}
#riaintra-global-header-root .product-text strong {
  display: block;
  font-size: 13px;
}
#riaintra-global-header-root .product-text small {
  display: block;
  color: rgba(255, 255, 255, 0.7);
  font-size: 13px;
  margin-top: 2px;
}

/* Desktop Navigation */
#riaintra-global-header-root .shell-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1 1 auto;
  justify-content: flex-start;
  padding-left: 24px;
}
#riaintra-global-header-root .shell-nav button {
  color: rgba(255, 255, 255, 0.82);
  font-size: 13px;
  font-weight: 600;
  padding: 8px 10px;
  border-radius: 4px;
  transition: all 0.15s ease;
  white-space: nowrap;
}
#riaintra-global-header-root .shell-nav button:hover, #riaintra-global-header-root .shell-nav button.active {
  color: #fff;
  background: var(--shell-hover);
}

/* Session / Dashboard Actions */
#riaintra-global-header-root .utility-action {
  min-height: 32px;
  padding: 0 10px;
  border: 1px solid rgba(255,255,255,.20);
  border-radius: 4px;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
#riaintra-global-header-root .utility-action:hover { background: var(--shell-hover); }
#riaintra-global-header-root .utility-action[hidden] { display: none !important; }

/* Clock */
#riaintra-global-header-root .clock {
  min-width: 110px;
  text-align: right;
  border-inline: 1px solid rgba(255, 255, 255, 0.18);
  padding: 4px 10px;
  cursor: pointer;
}
#riaintra-global-header-root .clock strong {
  display: block;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
#riaintra-global-header-root .clock small {
  display: block;
  color: rgba(255, 255, 255, 0.7);
  font-size: 13px;
  margin-top: 3px;
  text-transform: uppercase;
}

/* User Profile */
#riaintra-global-header-root .profile {
  display: none;
  grid-template-columns: minmax(150px, 230px) 38px;
  grid-template-rows: repeat(3, auto);
  column-gap: 9px;
  row-gap: 1px;
  align-items: center;
  min-width: 0;
}
#riaintra-global-header-root .profile-name,
#riaintra-global-header-root .profile-meta,
#riaintra-global-header-root .profile-email {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: right;
}
#riaintra-global-header-root .profile-name {
  grid-column: 1;
  grid-row: 1;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
}
#riaintra-global-header-root .profile-meta {
  grid-column: 1;
  grid-row: 2;
  color: #fff;
  font-size: 13px;
  font-weight: 800;
}
#riaintra-global-header-root .profile-email {
  grid-column: 1;
  grid-row: 3;
  color: rgba(255,255,255,.70);
  font-size: 13px;
}
#riaintra-global-header-root .profile-avatar {
  grid-column: 2;
  grid-row: 1 / span 3;
  width: 38px;
  height: 38px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  background: #d1e8ff;
  color: #073b69;
  font-size: 13px;
  font-weight: 800;
  overflow: hidden;
}
#riaintra-global-header-root .profile-avatar img,
#riaintra-global-header-root img.profile-avatar {
  width: 38px;
  height: 38px;
  object-fit: cover;
}

/* Mobile Burger Icon */

#riaintra-global-header-root .burger {
  display: none;
  width: 36px;
  height: 36px;
  color: #fff;
  border-radius: 4px;
}
#riaintra-global-header-root .burger:hover {
  background: var(--shell-hover);
}

/* Mobile Drawer (Horizontal Slider) */
#riaintra-global-header-root .mobile-drawer {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 1100;
  width: 100%;
  height: var(--shell-h);
  background: var(--shell);
  color: #fff;
  box-shadow: -20px 0 45px rgba(13, 31, 48, 0.25);
  transform: translateX(102%);
  opacity: 0.98;
  transition: transform 0.44s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
  display: flex;
  align-items: center;
}
#riaintra-global-header-root .mobile-drawer.open {
  transform: translateX(0);
  opacity: 1;
}

/* Mobile Drawer Title Area */
#riaintra-global-header-root .mobile-head {
  height: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px 0 18px;
  border-right: 1px solid rgba(255, 255, 255, 0.18);
  flex: 0 0 auto;
}
#riaintra-global-header-root .mobile-head strong { font-size: 13px; }
#riaintra-global-header-root .mobile-head .close {
  width: 28px;
  height: 28px;
  font-size: 22px;
  display: grid;
  place-items: center;
}

/* Mobile Drawer Nav List */
#riaintra-global-header-root .mobile-nav {
  height: 100%;
  display: flex;
  align-items: center;
  overflow-x: auto;
  scrollbar-width: none;
  flex: 1;
  padding: 0 12px;
  gap: 4px;
}
#riaintra-global-header-root .mobile-nav::-webkit-scrollbar { display: none; }
#riaintra-global-header-root .mobile-nav button {
  display: block;
  width: auto;
  white-space: nowrap;
  padding: 8px 12px;
  font-weight: 600;
  border-radius: 4px;
}
#riaintra-global-header-root .mobile-nav button:hover, #riaintra-global-header-root .mobile-nav button.active {
  background: var(--shell-hover);
}

/* Mobile Overlay */
#riaintra-global-header-root .overlay {
  position: fixed;
  inset: var(--shell-h) 0 0 0;
  background: rgba(7, 27, 68, 0.46);
  z-index: 1090;
  display: none;
}
#riaintra-global-header-root .overlay.show { display: block; }

body[data-theme="dark"] #riaintra-global-header-root {
  --canvas: #1f1f1f;
  --border: #3a3a3a;
  --text: #f3f2f1;
}

@media(max-width: 950px) {
  #riaintra-global-header-root .shell-nav { display: none; }
  #riaintra-global-header-root .burger { display: grid; place-items: center; }
  #riaintra-global-header-root .profile-email { display: none; }
}
@media(max-width: 700px) {
  #riaintra-global-header-root .profile { display: none !important; }
  #riaintra-global-header-root .clock { display: none; }
  #riaintra-global-header-root .utility-action { padding: 0 8px; font-size: 13px; }
}
</style>

<script data-skandi-part="skandi-shell-runtime">/** SKANDI compiled public-shell runtime — no alternate backend, no local cart. */
const SKANDI_SHELL_SOURCE = 'SKANDI_SHELL';
const SKANDI_SHELL_PARENT = 'SKANDI_WIX_PARENT';
const shellRoot = document.getElementById('skandi-shell-root');
if (!shellRoot) throw new Error('SKANDI shell mount missing');
let toolWordmarks = {};
function appWordmark(system, label) {
  const logo = Object.hasOwn(toolWordmarks, system) ? toolWordmarks[system] : '';
  if (!/^data:image\/png;base64,[a-z0-9+/=]+$/i.test(logo || '')) return '';
  const mark = document.createElement('span');
  mark.className = 'skandi-app-wordmark';
  mark.setAttribute('aria-hidden','true');
  const systemLogo = document.createElement('img');
  systemLogo.src = logo;
  systemLogo.alt = '';
  const software = document.createElement('strong');
  software.className = 'skandi-app-software';
  if (label === 'GroupTalk') {
    const accent = document.createElement('span');
    accent.textContent = 'talk';
    software.append('group', accent);
  } else {
    software.textContent = label;
  }
  mark.append(systemLogo,software);
  return mark.outerHTML;
}
window.__SKANDI_SHELL__ = Object.freeze({
  mode:'compiled-single-embed',
  page:shellRoot.dataset.skandiPage || '',
  root:shellRoot,
  appWordmark
});
// A single iframe passes Home, Header, Footer and Mobile messages to the
// same Wix Velo HtmlComponent. Existing message source/type values remain.
// The Wix master controller supplies canonical route and session data.
window.addEventListener('message', event => {
  if (event.source !== window.parent) return;
  let message = event.data;
  if (typeof message === 'string') {
    try { message = JSON.parse(message); } catch (_) { return; }
  }
  if (!message || message.source !== SKANDI_SHELL_PARENT) return;
  if (message.type === 'SKANDI_MASTER_CONFIG') {
    shellRoot.dataset.skandiPath = String(message.payload?.currentPath || '/');
    const marks = message.payload?.brand?.assets?.toolWordmarks;
    if (marks && typeof marks === 'object') toolWordmarks = marks;
  }
  if (message.type === 'SKANDI_SCROLL_TOP' || message.type === 'MASTER_SCROLL_TOP') {
    document.getElementById('skandi-app-root')?.scrollTo({ top:0, behavior:'instant' });
  }
});
window.parent?.postMessage({
  source:SKANDI_SHELL_SOURCE,
  type:'SKANDI_SHELL_READY',
  payload:{page:shellRoot.dataset.skandiPage || ''},
  timestamp:new Date().toISOString()
}, '*');

// Renew staff sessions only in response to real interactions, never a timer.
if (shellRoot.dataset.skandiFamily === 'riaintra' || shellRoot.dataset.skandiFamily === 'altea') {
  let lastStaffActivity = 0;
  const reportStaffActivity = event => {
    if (!event.isTrusted || Date.now() - lastStaffActivity < 5000) return;
    const context = window.__SKANDI_RECEIVER_CONTEXT__;
    if (!context?.allowed || context.key !== shellRoot.dataset.skandiKey) return;
    lastStaffActivity = Date.now();
    window.parent.postMessage({source:SKANDI_SHELL_SOURCE,type:'SKANDI_STAFF_ACTIVITY',payload:{key:context.key}}, '*');
  };
  for (const type of ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart']) {
    window.addEventListener(type, reportStaffActivity, {passive:true});
  }
}

// The universal receiver supplies this context only after canonical parent,
// manifest and digest validation. Legacy Home never opts into this handshake.
let shellAttempts = 0;
let shellConfigReceived = false;
let shellTimer;
function requestShellConfig() {
  if (++shellAttempts > 40 || shellConfigReceived) { clearInterval(shellTimer); return; }
  window.parent.postMessage({source:SKANDI_SHELL_SOURCE,type:'MASTER_CONFIG_REQUEST',payload:{context:'compiled-shell'}},'*');
}
window.addEventListener('message', event => {
  if (event.source !== window.parent) return;
  let message=event.data;
  if(typeof message==='string'){try{message=JSON.parse(message);}catch(_){return;}}
  if(message?.source===SKANDI_SHELL_PARENT && message.type==='SKANDI_MASTER_CONFIG') {
    shellConfigReceived=true;clearInterval(shellTimer);
  }
});
function startCompiledShell() {
  const context=window.__SKANDI_RECEIVER_CONTEXT__;
  if(context?.allowed===true && context.key===shellRoot.dataset.skandiKey) {
    window.parent.postMessage({source:SKANDI_SHELL_SOURCE,type:'SKANDI_COMPILED_READY',payload:{key:context.key}},'*');
  }
  shellTimer=setInterval(requestShellConfig,500);requestShellConfig();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startCompiledShell,{once:true});
else startCompiledShell();
</script>
<script data-skandi-part="header">(function(){
const __root=window.document.getElementById("riaintra-global-header-root");
const document=new Proxy(window.document,{get(target,key){if(key==='getElementById')return id=>{const el=target.getElementById(id);return el&&(__root===el||__root.contains(el))?el:null;};if(key==='querySelector'||key==='querySelectorAll')return selector=>{if(/^(?:html|body|head|meta|title|link)(?:[\s.#[:]|$)/i.test(selector)&&!selector.includes(' '))return target[key](selector);return __root[key](selector);};if(key==='getElementsByClassName'||key==='getElementsByTagName')return value=>__root[key](value);const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;},set(target,key,value){return Reflect.set(target,key,value,target);}});

(()=>{
  "use strict";
  
  const SOURCE = "SKANDI_RIAINTRA_HEADER";
  const PARENT = "SKANDI_WIX_PARENT";

  let config = null;
  let staff = {};

  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
  }[s]));

  function post(type, payload = {}) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: SOURCE,
        type,
        payload,
        timestamp: new Date().toISOString()
      }, "*");
    }
  }

  // Mobile Menu Logic
  function closeMenu() {
    $("mobileDrawer")?.classList.remove("open");
    $("drawerOverlay")?.classList.remove("show");
    /* Compiled shell owns internal chrome geometry. */
  }

  $("burger")?.addEventListener("click", (e) => {
    e.stopPropagation();
    const menu = $("mobileDrawer");
    const overlay = $("drawerOverlay");
    
    menu.classList.toggle("open");
    overlay.classList.toggle("show");
    
    if (menu.classList.contains("open")) {
      // Command Wix to expand iframe slightly so the dark overlay shows
      /* Compiled shell owns internal chrome geometry. */ 
    } else {
      /* Compiled shell owns internal chrome geometry. */
    }
  });

  $("drawerClose")?.addEventListener("click", closeMenu);
  $("drawerOverlay")?.addEventListener("click", closeMenu);

  // Render Data
  function render() {
    // 1. Branding
    const header = config?.internal?.header || {};
    const logo = config?.brand?.assets?.logos?.riaHeader || "";
    
    if (logo && $("logo")) $("logo").src = logo;
    if (header.productName && $("riaintra-header-productName")) $("riaintra-header-productName").textContent = header.productName;
    const language = String(config?.settings?.language || "EN").trim().toLowerCase();
    const slogans = config?.brand?.slogans?.riaintra || {};
    if ($("productContext")) $("productContext").textContent = slogans[language] || slogans.en || header.productContext || "";

    // 2. Navigation
    const current = config?.currentPath || "";
    const items = header.primaryNav || config?.nav || [];
    
    if (Array.isArray(items) && items.length > 0) {
      const markup = items.map(i => {
        const active = current === i.path || (i.path && current.startsWith(i.path + "/"));
        return `<button type="button" class="${active ? "active" : ""}" data-path="${esc(i.path)}">${esc(i.label)}</button>`;
      }).join("");
      
      if ($("riaintra-header-desktopNav")) $("riaintra-header-desktopNav").innerHTML = markup;
      if ($("riaintra-header-mobileNav")) $("riaintra-header-mobileNav").innerHTML = markup;
    }

    // 3. Canonical staff profile from Wix parent -> SKANDI_CORE/staffAuth -> Supabase agent_users.
    const p = staff.profile || config?.staff?.profile || {};
    const full =
      p.displayName || p.display_name || p.fullName || p.name ||
      [p.firstName || p.first_name, p.lastName || p.last_name].filter(Boolean).join(" ") ||
      "Employee";
    const skId = String(p.skId || p.skID || p.sk_id || p.employeeId || p.employee_id || "").trim().toUpperCase();
    const baseCode = String(p.baseCode || p.base_code || p.base || p.station || "").trim().toUpperCase();
    const corporateEmail = String(
      p.corporateEmail || p.corporate_email || p.corporateEmailAddress ||
      p.corporate_email_address || p.workEmail || p.email || ""
    ).trim();
    const photo = String(
      p.badgePhotoUrl || p.badge_photo_url || p.photoUrl ||
      p.profilePhotoUrl || p.photo || ""
    ).trim();
    const hasData = Boolean(skId || full !== "Employee" || corporateEmail || photo);

    if ($("userProfile")) $("userProfile").style.display = hasData ? "grid" : "none";

    if (hasData) {
      const initials = [p.firstName || p.first_name, p.lastName || p.last_name]
        .filter(Boolean).map(v => String(v)[0]).join("").slice(0, 2).toUpperCase() ||
        full.slice(0, 2).toUpperCase();

      if ($("userName")) $("userName").textContent = full;
      if ($("userMeta")) $("userMeta").textContent = [skId, baseCode].filter(Boolean).join(" • ") || "RIAINTRA";
      if ($("userEmail")) $("userEmail").textContent = corporateEmail || "—";

      if (photo) {
        $("badge_photo_url").src = photo;
        $("badge_photo_url").style.display = "block";
        $("avatarFallback").style.display = "none";
      } else {
        $("badge_photo_url").style.display = "none";
        $("avatarFallback").style.display = "grid";
        $("avatarFallback").textContent = initials;
      }
    }

    // Return to Dashboard is hidden only on the Success Factors dashboard itself.
    const normalizedCurrent = String(current || "").split("?")[0].replace(/\/$/, "") || "/";
    if ($("returnDashboardBtn")) {
      $("returnDashboardBtn").hidden = normalizedCurrent === "/riaintra/success-factors";
    }
  }

  // Navigation Logic
  document.addEventListener("click", e => {
    const btn = e.target.closest("[data-path]");
    if (!btn) return;
    
    const path = btn.dataset.path;
    
    // Update local active state visually
    document.querySelectorAll("[data-path]").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(`[data-path="${path}"]`).forEach(b => b.classList.add("active"));
    
    if (config) config.currentPath = path;

    closeMenu();
    post("RIAINTRA_NAVIGATE", { path });
  });

  $("returnDashboardBtn")?.addEventListener("click", () => {
    post("RIAINTRA_NAVIGATE", {
      path:config?.routes?.successFactors || "/riaintra/success-factors"
    });
  });

  $("logoutBtn")?.addEventListener("click", () => {
    post("RIAINTRA_LOGOUT", {});
  });

  // Clock Logic
  let clockUsesUtc = false;
  function updateClock() {
    const now = new Date();
    const opts = {
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
      ...(clockUsesUtc ? { timeZone: "UTC" } : {})
    };
    if ($("sfClockTime")) $("sfClockTime").textContent = new Intl.DateTimeFormat(undefined, opts).format(now);
    if ($("sfClockDate")) $("sfClockDate").textContent = clockUsesUtc 
      ? `${now.toISOString().slice(0, 10)} UTC` 
      : new Intl.DateTimeFormat(undefined, { weekday: "short", day: "2-digit", month: "short" }).format(now).toUpperCase();
  }

  $("sfClock")?.addEventListener("click", () => {
    clockUsesUtc = !clockUsesUtc;
    updateClock();
  });
  
  setInterval(updateClock, 1000);
  updateClock();

  // Listen for Wix Parent Messages
  window.addEventListener("message", e => {
    const m = e.data || {};
    if (m.source !== PARENT) return;

    if (m.type === "SKANDI_MASTER_CONFIG") {
      config = m.payload || {};
      render();
    }

    if ([
      "RIAINTRA_HEADER_STATE",
      "UPDATE_PROFILE",
      "INTERNAL_CHROME_BOOTSTRAP",
      "GLOBAL_HEADER_BOOTSTRAP"
    ].includes(m.type)) {
      const payloadProfile =
        m.payload?.profile ||
        m.payload?.session?.profile ||
        m.payload?.session ||
        m.payload ||
        {};
      staff.profile = { ...staff.profile, ...payloadProfile };
      render();
    }
  });

  // Signal Wix parent window that embed is ready
  post("MASTER_CONFIG_REQUEST", { context: "riaintra-header" });
  post("RIAINTRA_HEADER_READY", {});
  /* Compiled shell owns internal chrome geometry. */

})();


})();</script>

const document=new Proxy(window.document,{get(target,key){if(key==='getElementById')return id=>{const el=target.getElementById(id);return el&&(__root===el||__root.contains(el))?el:null;};if(key==='querySelector'||key==='querySelectorAll')return selector=>{if(/^(?:html|body|head|meta|title|link)(?:[\s.#[:]|$)/i.test(selector)&&!selector.includes(' '))return target[key](selector);return __root[key](selector);};if(key==='getElementsByClassName'||key==='getElementsByTagName')return value=>__root[key](value);const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;},set(target,key,value){return Reflect.set(target,key,value,target);}});
const SOURCE='SKANDI_HOME_MOBILE_APP';
  const PARENT='SKANDI_WIX_PARENT';
  const ROUTE_FALLBACKS=Object.freeze({
    home:'/', destinations:'/destinations',
    myTrips:'/my-profile?tab=trips', myProfile:'/my-profile', bookingFlow:'/booking'
  });
  const defaults={
    ...ROUTE_FALLBACKS,
    travelInfo:'/travel-info',flights:'/flights',hotels:'/hotels',packages:'/packages',
    cruises:'/cruises',tours:'/tours-activities',carRental:'/car-rental',transfers:'/travel-info?section=transfers',
    skandiCollection:'/skandi-collection',voy:'/voy-magazine',club:'/skandi-club',
    support:'/about/support',theStore:'/the-store',about:'/about'
  };
  const publicGroups=[
    {title:'Book & travel',keys:[['Book a trip','home'],['Flights','flights'],['Hotels','hotels'],['Packages','packages'],['Cruises','cruises'],['Tours & Activities','tours'],['Car rental','carRental'],['Transfers','transfers']]},
    {title:'Explore',keys:[['Destinations','destinations'],['SKANDI Collection','skandiCollection'],['VOY Magazine','voy']]},
    {title:'Travel help',keys:[['Travel information','travelInfo'],['Flight status','flightStatus'],['Passport & visa','passportVisa'],['Baggage allowance','baggageAllowance'],['Travel insurance','travelInsurance'],['Special assistance','specialAssistance'],['Help Center','support']]},
    {title:'Your SKANDI',keys:[['My Trips','myTrips'],['SKANDI Club','club'],['My Profile','myProfile'],['The Store','theStore']]},
    {title:'About SKANDI',keys:[['About','about'],['Newsroom','newsroom'],['Careers','careers'],['Legal','legal'],['Policies','policies'],['Cookie preferences','cookiePreferences'],['Staff login','riaintra']]}
  ];
  const $=id=>document.getElementById(id);
  const bar=$('skandi-mobile-nav-root');
  const BUTTONS=Array.from(bar.querySelectorAll('[data-skandi-mobile-route]'));
  const menuButton=BUTTONS.find(btn=>btn.dataset.skandiMobileRoute==='menu');
  const drawer=$('drawer');
  const status=$("skandi-mobile-status");
  const shell=window.__SKANDI_SHELL__?.root;
  const family=shell?.dataset.skandiFamily||'public';
  const isStaff=family==='riaintra'||family==='altea';
  const brand=family==='altea'?'ALTEA':family==='riaintra'?'RIAINTRA':'SKANDI TRAVELS';
  const staffIcons={
    workspace:'M3 9l9-6 9 6v11H3z M9 20v-7h6v7',
    mail:'M3 5h18v14H3z M3 6l9 7 9-7',
    docs:'M5 3h10l4 4v14H5z M14 3v5h5 M8 12h8 M8 16h8',
    altea:'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z',
    reservations:'M3 7h18v10H3z M8 7v10 M13 11h5',
    eos:'M7 3h10v18H7z M10 17h4'
  };
  const drawerTitle=isStaff?brand+' menu':'Explore SKANDI';
  const state={routes:{...defaults},currentPath:'/',request:0,drawerOpen:false,drawerPending:'',drawerTimer:null,chatOpen:false,lastFocused:null,staffNavigation:null};
  bar.setAttribute('aria-label',brand+' mobile navigation');
  $('drawer-brand').textContent=brand;
  $('drawer-title').textContent=drawerTitle;
  if(isStaff) {
    drawer.dataset.staffMenu='';
    $('drawer-actions').hidden=true;
  }
  let focusTransitionToken=0;
  const safePath=value=>{
    const path=String(value||'').trim();
    return /^\/(?!\/)/.test(path) && !/[\\\u0000-\u0020]/.test(path) && !/%5c|%0[0-9a-f]|%1[0-9a-f]/i.test(path)?path:'';
  };
  const nextId=key=>key+'-'+Date.now()+'-'+(++state.request);
  function post(type,payload={},requestId=''){
    const message={source:SOURCE,type,payload,timestamp:new Date().toISOString()};
    if(requestId)message.requestId=requestId;
    window.parent.postMessage(message,'*');
  }
  function pathFor(key){return safePath(state.routes[key])||safePath(defaults[key]);}
  function updateActive(){
    const current=safePath(state.currentPath)||'/';
    const normalized=current.split('?')[0];
    for(const button of BUTTONS){
      const key=button.dataset.skandiMobileRoute;
      const path=isStaff?safePath(button.dataset.path):pathFor(key);
      const active=path&&(path.includes('?')?current===path:normalized===path || key==='destinations'&&normalized.startsWith('/destinations/'));
      if(active)button.setAttribute('aria-current','page');
      else button.removeAttribute('aria-current');
    }
  }
  function navigatePath(path){
    if(!safePath(path))return;
    closeDrawer();
    post('MASTER_NAVIGATE',{path},nextId('nav'));
  }
  function navigate(key){navigatePath(pathFor(key));}
  function renderMenu(){
    const root=$('drawerLinks');
    const openTitles=new Set(Array.from(root.querySelectorAll('details[open] summary'),item=>item.textContent));
    const focused=document.activeElement;
    const focusedKey=root.contains(focused)?focused.dataset.menuKey:'';
    const renderedItems=new Map();
    const groups=isStaff?(state.staffNavigation?.groups||[]):publicGroups.map(group=>({
      title:group.title, links:group.keys.map(([label,key])=>({label,path:pathFor(key)}))
    }));
    root.replaceChildren();
    for(const group of groups){
      const links=(group.links||[]).filter(link=>safePath(link.path));
      if(!links.length)continue;
      const section=document.createElement('details');
      section.className='drawer-group';
      section.open=openTitles.has(group.title)||(!openTitles.size&&links.some(link=>link.path===state.currentPath));
      const heading=document.createElement('summary');
      heading.className='group-heading';heading.textContent=group.title;
      heading.dataset.menuKey=group.title;renderedItems.set(group.title,heading);
      section.appendChild(heading);
      for(const link of links){
        const button=document.createElement('button');
        button.type='button';button.className='drawer-link';
        button.dataset.menuKey=link.path;renderedItems.set(link.path,button);
        const text=document.createElement('span');text.textContent=link.label;
        const chevron=document.createElement('b');chevron.textContent='›';chevron.setAttribute('aria-hidden','true');
        button.append(text,chevron);
        button.addEventListener('click',()=>navigatePath(link.path));
        section.appendChild(button);
      }
      root.appendChild(section);
    }
    if(isStaff&&!root.childElementCount){
      const notice=document.createElement('p');
      notice.textContent=state.staffNavigation?'No navigation is available for this session.':'Loading navigation…';
      root.appendChild(notice);
    }
    if(isStaff){
      const tabs=state.staffNavigation?.tabs||[];
      BUTTONS.filter(button=>button!==menuButton).forEach((button,index)=>{
        const tab=tabs[index];
        button.hidden=!safePath(tab?.path);
        button.dataset.path=safePath(tab?.path);
        button.querySelector('span').textContent=tab?.shortLabel||tab?.label||'';
        const icon=staffIcons[tab?.icon];
        const svg=button.querySelector('svg');
        if(icon){
          const path=document.createElementNS('http://www.w3.org/2000/svg','path');
          path.setAttribute('d',icon);
          svg.replaceChildren(path);
        }
        button.setAttribute('aria-label',tab?.label||'Navigation');
      });
    }
    if(focusedKey)renderedItems.get(focusedKey)?.focus({preventScroll:true});
    updateActive();
  }
  function preferredHeight(open){
    if(!open)return 88; // Canonical V12 host closed geometry: 88px; visual bar is 68px.
    return Math.max(220,Math.round(window.visualViewport?.height||window.innerHeight||844)-52);
  }
  function requestSize(open,requestId){
    post('HOME_APP_DRAWER_RESIZE',{open,height:preferredHeight(open)},requestId);
  }
  function announce(message){status.textContent=String(message||'');}
  function setDrawerVisible(open){
    state.drawerOpen=Boolean(open);
    document.body.classList.toggle('drawer-open',state.drawerOpen);
    drawer.setAttribute('aria-hidden',String(!state.drawerOpen));
    menuButton.setAttribute('aria-expanded',String(state.drawerOpen));
    $('overlay').setAttribute('aria-hidden',String(!state.drawerOpen));
    // The drawer is modal inside a compiled embed. Keep page controls out of its focus order.
    const app=shell?.querySelector('#skandi-app-root');
    if(app)app.inert=state.drawerOpen;
    if(!state.drawerOpen)stopChat();
  }
  function openDrawer(){
    if(state.drawerOpen||state.drawerPending)return;
    state.lastFocused=document.activeElement;
    announce('');
    if((window.parent===window||Boolean(window.__SKANDI_SHELL__))){setDrawerVisible(true);$("skandi-mobile-closeBtn").focus({preventScroll:true});return;}
    const requestId=nextId('drawer-open');
    state.drawerPending=requestId;
    requestSize(true,requestId);
    clearTimeout(state.drawerTimer);
    state.drawerTimer=setTimeout(()=>{
      if(state.drawerPending!==requestId)return;
      state.drawerPending='';
      announce('The menu could not open. Please try again.');
    },5000);
  }
  function closeDrawer(){
    const wasOpen=state.drawerOpen||Boolean(state.drawerPending);
    if(!wasOpen)return;
    ++focusTransitionToken;
    clearTimeout(state.drawerTimer);
    state.drawerPending='';
    setDrawerVisible(false);
    if((window.parent!==window&&!window.__SKANDI_SHELL__))requestSize(false,nextId('drawer-close'));
    const target=state.lastFocused instanceof HTMLElement?state.lastFocused:menuButton;
    target.focus({preventScroll:true});
    state.lastFocused=null;
  }
  function forceCloseDrawer(){
    ++focusTransitionToken;
    clearTimeout(state.drawerTimer);
    state.drawerPending='';
    setDrawerVisible(false);
  }
  function acceptOpenWhenResized(requestId){
    const token=++focusTransitionToken;
    const started=Date.now();

      if(token!==focusTransitionToken||state.drawerPending!==requestId)return;
      if(window.innerHeight>=220){
        clearTimeout(state.drawerTimer);
        state.drawerPending='';
        setDrawerVisible(true);
        $("skandi-mobile-closeBtn").focus({preventScroll:true});
        return;
      }
      if(Date.now()-started>=1100){
        state.drawerPending='';
        clearTimeout(state.drawerTimer);
        announce('The menu needs a page-level mobile embed that can expand.');
        requestSize(false,nextId('drawer-recover'));
        return;
      }
      requestAnimationFrame(check);
    }
    requestAnimationFrame(check);
  }
  function chatSend(type,payload={}){post('SKANDI_SUPPORT_CHAT',{type,payload},nextId('chat'));}
  function stopChat(){
    if(!state.chatOpen)return;
    chatSend('SUPPORT_CHAT_PANEL_CLOSE');
    state.chatOpen=false;
    drawer.classList.remove('chat-mode');
    $('drawer-title').textContent=drawerTitle;
  }
  function openChat(){
    state.chatOpen=true;
    drawer.classList.add('chat-mode');
    $('drawer-title').textContent='Alexandra';
    $('chatStatus').textContent='Connecting to Alexandra…';
    chatSend('SUPPORT_CHAT_START_ALEXANDRA',{requestId:nextId('alexandra-open')});
    $('chatInput').focus({preventScroll:true});
  }
  function bubble(message,mine=false){
    const div=document.createElement('div');
    div.className='bubble'+(mine?' mine':'');
    div.textContent=String(message||'').slice(0,4000);
    $('chatLog').appendChild(div);
    div.scrollIntoView({block:'end'});
  }
  for(const button of BUTTONS){
    button.addEventListener('click',()=>{
      if(button.dataset.skandiMobileRoute==='menu'){
        if(state.drawerOpen)closeDrawer();else openDrawer();
      } else if(isStaff)navigatePath(button.dataset.path);
      else navigate(button.dataset.skandiMobileRoute);
    });
  }
  $('overlay').addEventListener('click',closeDrawer);
  $("skandi-mobile-closeBtn").addEventListener('click',()=>state.chatOpen?stopChat():closeDrawer());
  $('staffSignOut').addEventListener('click',()=>{
    closeDrawer();
    post('RIAINTRA_LOGOUT',{},nextId('sign-out'));
  });
  $('profileLink').addEventListener('click',()=>navigate('myProfile'));
  $('searchLink').addEventListener('click',()=>{
    closeDrawer();
    post('HOME_APP_FOCUS_SEARCH',{},nextId('focus'));
  });
  $('alexandraLink').addEventListener('click',openChat);
  $('chatForm').addEventListener('submit',event=>{
    event.preventDefault();
    const input=$('chatInput');
    const message=input.value.trim();
    if(!message)return;
    bubble(message,true);
    input.value='';
    chatSend('SUPPORT_CHAT_SUBMIT_FORM',{message,text:message});
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){
      if(state.chatOpen)stopChat();else closeDrawer();
    }
    if(event.key==='Tab'&&state.drawerOpen){
      const visible=Array.from(drawer.querySelectorAll('summary,button:not([disabled]),input:not([disabled]),textarea:not([disabled])'))
        .filter(el=>el.getClientRects().length>0);
      if(!visible.length){event.preventDefault();drawer.focus();return;}
      const first=visible[0],last=visible[visible.length-1];
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
    }
  });
  window.addEventListener('message',event=>{
    if(event.source!==window.parent)return;
    let message=event.data;
    if(typeof message==='string'){try{message=JSON.parse(message);}catch(_){return;}}
    if(!message||typeof message!=='object'||message.source!==PARENT)return;
    if(message.type==='SKANDI_MASTER_CONFIG'){
      const config=message.payload||{};
      for(const key of Object.keys(config.routes||{})){
        const candidate=safePath(config.routes?.[key]);
        if(candidate)state.routes[key]=candidate;
      }
      state.currentPath=safePath(config.currentPath)||state.currentPath;
      if(isStaff&&config.mobileNavigation?.family===family){
        state.staffNavigation=config.mobileNavigation;
        $('staff-drawer-actions').hidden=!state.staffNavigation.groups?.length;
      }
      if(isStaff){
        const logo=config.brand?.assets?.toolWordmarks?.[family];
        if(/^data:image\/png;base64,[a-z0-9+/=]+$/i.test(logo||'')){
          $('drawer-logo').src=logo;
          $('drawer-logo').hidden=false;
          $('drawer-brand').hidden=true;
        }
      }
      renderMenu();
      return;
    }
    if(message.type==='HOME_APP_DRAWER_RESIZE_ACK'){
      const requestId=String(message.requestId||'');
      if(message.payload?.open===true){
        if(state.drawerPending&&requestId===state.drawerPending)acceptOpenWhenResized(requestId);
        else requestSize(false,nextId('drawer-stale-ack'));
      }
      return;
    }
    if(message.type==='HOME_APP_DRAWER_FORCE_CLOSE'){forceCloseDrawer();return;}
    if(message.type==='HOME_APP_DRAWER_RESIZE_ERROR'){
      clearTimeout(state.drawerTimer);
      state.drawerPending='';
      announce(message.payload?.message||'The menu could not open.');
      return;
    }
    if(message.type==='SUPPORT_CHAT_OPEN'){if(state.chatOpen)$('chatStatus').textContent='Connected to Alexandra';return;}
    if(message.type==='SUPPORT_CHAT_ERROR'){if(state.chatOpen)$('chatStatus').textContent=message.payload?.message||'Chat connection unavailable';return;}
    if(message.type==='SUPPORT_CHAT_SNAPSHOT'&&state.chatOpen){
      const data=message.payload||{};
      if(Array.isArray(data.messages))for(const item of data.messages.slice(-15))if(item?.text||item?.message)bubble(item.text||item.message,Boolean(item.mine));
      return;
    }
    if(message.type==='SUPPORT_CHAT_CASE_CREATED'&&state.chatOpen){$('chatStatus').textContent='Case created';return;}
  });
  window.addEventListener('resize',()=>{
    if(state.drawerOpen&&shell&&window.innerWidth>1020)closeDrawer();
    else if(state.drawerOpen&&(window.parent!==window&&!window.__SKANDI_SHELL__))requestSize(true,nextId('viewport-resize'));
  });
  renderMenu();
  post('MASTER_CONFIG_REQUEST',{context:'mobile-navigation'});
  post('HOME_APP_READY',{},nextId('ready'));


})();</script>

<script type="text/babel">

const EMPLOYEE_PATH = "/riaintra/success-factors/uniform";
const CLOSED = new Set(["COMPLETED", "REJECTED", "CANCELLED", "RETURNED"]);
const PENDING_APPROVAL = new Set(["PENDING", "SUBMITTED", "MANAGER_REVIEW"]);
const PRODUCT_STATUSES = ["DRAFT", "ACTIVE", "SEASONAL", "PHASE_OUT", "DISCONTINUED", "ARCHIVED", "SUSPENDED"];
const STOCK_STATUSES = ["IN_STOCK", "LOW_STOCK", "OUT_OF_STOCK", "HIDDEN", "ARCHIVED"];
const ORDER_NEXT = {
  PENDING: ["MANAGER_REVIEW", "APPROVED", "REJECTED", "CANCELLED"],
  SUBMITTED: ["MANAGER_REVIEW", "APPROVED", "REJECTED", "CANCELLED"],
  MANAGER_REVIEW: ["APPROVED", "REJECTED", "CANCELLED"],
  APPROVED: ["FULFILLMENT_READY", "PICKING", "PARTIAL", "CANCELLED"],
  FULFILLMENT_READY: ["PICKING", "PICKED", "PACKING", "READY_FOR_PICKUP", "SHIPPED", "PARTIAL", "CANCELLED"],
  PICKING: ["PICKED", "PARTIAL", "CANCELLED"],
  PICKED: ["PACKING", "PARTIAL", "CANCELLED"],
  PACKING: ["READY_FOR_PICKUP", "SHIPPED", "PARTIAL", "CANCELLED"],
  READY_FOR_PICKUP: ["DELIVERED", "COMPLETED", "RETURN_REQUESTED"],
  SHIPPED: ["DELIVERED", "PARTIAL", "RETURN_REQUESTED"],
  DELIVERED: ["COMPLETED", "RETURN_REQUESTED"],
  PARTIAL: ["PICKING", "PACKING", "READY_FOR_PICKUP", "SHIPPED", "DELIVERED", "COMPLETED", "CANCELLED"],
  RETURN_REQUESTED: ["RETURNED", "COMPLETED"]
};

const emptyData = {
  version: "", session: {}, profile: {}, stats: {}, orders: [], catalog: [], categories: [], allowanceRules: [],
  wallets: [], walletLedger: [], audit: [], policy: null, assets: [], eligibilityOptions: { roles: [], departments: [], bases: [] },
  capabilities: {}, lastSync: ""
};

const Icon = ({ name, size = 14, className = '', ...props }) => (
  <i data-lucide={name} style={{ width: size, height: size }} className={className} {...props}></i>
);

const arr = v => Array.isArray(v) ? v : [];
const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
const csv = v => Array.isArray(v) ? v : String(v ?? '').split(',').map(x => x.trim()).filter(Boolean);
const upper = v => String(v ?? '').trim().toUpperCase();
const num = (v, fallback = 0) => Number.isFinite(Number(v)) ? Number(v) : fallback;
const text = v => String(v ?? '');
const bool = v => v === true || v === 'true';
const money = (value, currency='USD') => {
  try { return new Intl.NumberFormat(undefined, { style:'currency', currency: currency || 'USD' }).format(Number(value || 0)); }
  catch (_) { return `${Number(value || 0).toFixed(2)} ${currency || 'USD'}`; }
};
const fmtDate = value => {
  if (!value) return '—';
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString();
};
const reqId = () => `UNI-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;

function Modal({ title, onClose, onSave, children, saveLabel="Save", saveDisabled=false, width="800px", footerExtra=null }) {
  return (
    <div className="modal-overlay" onMouseDown={onClose}>
      <div className="modal-window" style={{width}} onMouseDown={e => e.stopPropagation()}>
        <div className="modal-header">
          <h3>{title}</h3>
          <Icon name="x" className="modal-close" size={16} onClick={onClose} />
        </div>
        <div className="modal-body" style={{padding:'0'}}>{children}</div>
        <div className="modal-footer" style={{justifyContent: footerExtra ? 'space-between' : 'flex-end'}}>
          {footerExtra || <span />}
          <div style={{display:'flex', gap:'8px'}}>
            <button className="btn" onClick={onClose}>Close</button>
            {onSave && <button className="btn btn-primary" onClick={onSave} disabled={saveDisabled}>{saveLabel}</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

function StatusBadge({ value }) {
  const v = upper(value) || 'UNKNOWN';
  let cls = 'status-draft';
  if (["ACTIVE","APPROVED","ALLOCATED","DELIVERED","COMPLETED","IN_STOCK","PROCESSED","AUTHORIZED","POSTED"].includes(v)) cls = 'status-active';
  else if (["PENDING","SUBMITTED","MANAGER_REVIEW","FULFILLMENT_READY","PICKING","PICKED","PACKING","READY_FOR_PICKUP","SHIPPED","PARTIAL","LOW_STOCK","PENDING_AUTHORIZATION"].includes(v)) cls = 'status-pending';
  else if (["REJECTED","DECLINED","CANCELLED","RETURNED","OUT_OF_STOCK","ARCHIVED","SUSPENDED"].includes(v)) cls = 'status-danger';
  return <span className={`status-badge ${cls}`}>{v.replaceAll('_',' ')}</span>;
}

function Gate({ title, text: body, code }) {
  return (
    <div style={{border:'1px solid var(--am-border)', background:'#f9fafb', borderRadius:'4px', padding:'16px', minHeight:'132px'}}>
      <div style={{display:'flex', justifyContent:'space-between', gap:'8px', alignItems:'center'}}>
        <strong style={{fontSize:'12px'}}>{title}</strong>
        <StatusBadge value="Schema gated" />
      </div>
      <p style={{color:'var(--am-text-light)', lineHeight:'1.5', margin:'10px 0'}}>{body}</p>
      <div className="mono" style={{color:'var(--am-blue)', fontSize:'10px'}}>{code}</div>
    </div>
  );
}

function Empty({ children }) {
  return <div style={{padding:'30px', textAlign:'center', color:'var(--am-text-light)', background:'#f9fafb', border:'1px dashed var(--am-border)', borderRadius:'4px'}}>{children}</div>;
}

function Field({ label, children, hint }) {
  return <div className="form-group"><label className="form-label">{label}</label>{children}{hint && <div style={{fontSize:'9px', color:'var(--am-text-light)', marginTop:'4px'}}>{hint}</div>}</div>;
}

function TextField({ label, value, onChange, type='text', disabled=false, placeholder='', hint='' }) {
  return <Field label={label} hint={hint}><input className="form-control" type={type} value={value ?? ''} onChange={e=>onChange(e.target.value)} disabled={disabled} placeholder={placeholder}/></Field>;
}
function TextAreaField({ label, value, onChange, rows=4, hint='' }) {
  return <Field label={label} hint={hint}><textarea className="form-control" rows={rows} value={value ?? ''} onChange={e=>onChange(e.target.value)}/></Field>;
}
function SelectField({ label, value, onChange, options, hint='' }) {
  return <Field label={label} hint={hint}><select className="form-control" value={value ?? ''} onChange={e=>onChange(e.target.value)}>{options.map(o=>{const x=typeof o==='string'?{value:o,label:o}:o;return <option key={x.value} value={x.value}>{x.label}</option>})}</select></Field>;
}
function MultiSelectField({ label, value, onChange, options, hint='' }) {

  return <Field label={label} hint={hint}><select className="form-control" multiple style={{height:'110px', padding:'5px'}} value={[...selected]} onChange={e=>onChange([...e.target.selectedOptions].map(o=>o.value))}>{options.map(o=><option key={o} value={o}>{o}</option>)}</select></Field>;
}
function UniformLogo({ url }) {
  const [imgState, setImgState] = React.useState('pending');

  React.useEffect(() => {
    if (!url) {
      setImgState('empty');
    } else {
      setImgState('loading');
    }
  }, [url]);

  const showFallback = imgState !== 'loaded';

  return (
    <>
      {/* Fallback Block */}
      <div 
        className="nav-item" 
        id="collectionLogoFallback"
        title="SKANDI Logo" 
        style={{
          background: '#fff', 
          color: '#071522', 
          fontWeight: '900', 
          fontSize: '16px', 
          fontFamily: 'serif',
          display: showFallback ? 'flex' : 'none'
        }}
      >
        S
      </div>

      {/* Image Block */}
      <div 
        className="nav-item" 
        style={{
          background: '#fff', 
          padding: 0, 
          overflow: 'hidden',
          display: imgState === 'loaded' ? 'flex' : 'none'
        }}
      >
        {url && (
          <img 
            id="collectionLogo"
            src={url} 
            alt="SKANDI Uniform Logo" 
            onLoad={() => setImgState('loaded')}
            onError={() => setImgState('error')}
            style={{ width: '100%', height: '100%', objectFit: 'contain' }}
          />
        )}
      </div>
    </>
  );
}

        const p=pending.current.get(m.requestId);
        if (m.type==='UNIFORM_ADMIN_ERROR') {
          clearTimeout(p.timer); pending.current.delete(m.requestId); p.reject(new Error(m.message || m.payload?.message || 'Uniform Control error.')); return;

    const upload=async file=>{
      if(!file)return;
      setUploading(true);setError('');
      try{
        const hashBuf=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());
        const sha256=[...new Uint8Array(hashBuf)].map(b=>b.toString(16).padStart(2,'0')).join('');
        let prepared=await request('UNIFORM_ADMIN_ASSET_PREPARE_UPLOAD',{file:{name:file.name,type:file.type,size:file.size},sha256,displayName:file.name,contextRecordId:itemId||'',tags:['uniform','product']},'UNIFORM_ADMIN_ASSET_UPLOAD_PREPARED');

        if(prepared.needsReview&&prepared.possibleLegacyDuplicates?.length){if(!confirm('A possible duplicate asset exists. Upload anyway?'))return;prepared=await request('UNIFORM_ADMIN_ASSET_PREPARE_UPLOAD',{file:{name:file.name,type:file.type,size:file.size},sha256,displayName:file.name,contextRecordId:itemId||'',tags:['uniform','product'],allowPossibleDuplicate:true},'UNIFORM_ADMIN_ASSET_UPLOAD_PREPARED');}
        if(!prepared.upload?.signedUrl)throw new Error('Asset upload URL was not created.');

        if(!res.ok)throw new Error(`Asset upload failed (${res.status}).`);
        const finalized=await request('UNIFORM_ADMIN_ASSET_FINALIZE_UPLOAD',{requestId:prepared.requestId},'UNIFORM_ADMIN_ASSET_UPLOAD_FINALIZED');

  async function batchOrderAction(action){
    const chosen=orders.filter(o=>selectedRows.includes(o.id||o.orderId));
    const eligibleRows=chosen.filter(o=>(ORDER_NEXT[upper(o.status)]||[]).includes(action));
    if(!eligibleRows.length){setError(`No selected order can move to ${action}.`);return;}
    setIsSyncing(true);setError('');
    try{for(const o of eligibleRows)await request('UNIFORM_ADMIN_ORDER_ACTION',{orderId:o.orderId||o.id,action,note:`Batch ${action} from Uniform Control`});setSelectedRows([]);refresh();}
    catch(e){setIsSyncing(false);setError(e.message||'Order update failed.');}
  }

    if(view==='System Access')return <div style={{display:'flex',flexDirection:'column',height:'100%'}}><Toolbar title="System Access & Capability Boundary"/><div className="table-container"><div className="two-col-grid"><div className="am-table-wrapper"><table className="am-table"><tbody><tr><th>SK-ID</th><td>{data.session?.skId||data.profile?.skId||'—'}</td></tr><tr><th>Name</th><td>{data.session?.displayName||data.profile?.displayName||'—'}</td></tr><tr><th>Access Role</th><td>{data.session?.accessRole||'—'}</td></tr><tr><th>Permission Groups</th><td>{arr(data.session?.permissionGroups).join(', ')||'—'}</td></tr><tr><th>Permission Keys</th><td>{arr(data.session?.permissionKeys).join(', ')||'—'}</td></tr><tr><th>Backend Version</th><td className="mono">{data.version||'—'}</td></tr></tbody></table></div><div className="am-table-wrapper"><table className="am-table"><thead><tr><th>Capability</th><th>Status</th></tr></thead><tbody>{Object.entries(capabilities).map(([k,v])=><tr key={k}><td className="mono">{k}</td><td><StatusBadge value={v?'ACTIVE':'GATED'}/></td></tr>)}</tbody></table></div></div></div></div>;
    const open=orders.filter(o=>!CLOSED.has(upper(o.status))).length;
    return <div style={{display:'flex',flexDirection:'column',height:'100%'}}><Toolbar title="Uniform Control Dashboard" secondaryAction={{label:'Employee Center',icon:'external-link',onClick:()=>post('UNIFORM_ADMIN_NAVIGATE',{path:EMPLOYEE_PATH})}} primaryAction={{label:'Refresh',icon:'refresh-cw',onClick:()=>refresh()}}/><div className="table-container"><div className="kpi-grid"><div className="kpi-card"><div className="kpi-title">Active Catalog</div><div className="kpi-val">{data.stats?.catalog??catalog.filter(x=>x.active!==false).length}</div></div><div className="kpi-card"><div className="kpi-title">Styles</div><div className="kpi-val">{data.stats?.styles??new Set(catalog.map(x=>x.styleGroup)).size}</div></div><div className="kpi-card"><div className="kpi-title">Open Orders</div><div className="kpi-val">{data.stats?.openOrders??open}</div></div><div className="kpi-card"><div className="kpi-title">Wallets</div><div className="kpi-val">{wallets.length}</div></div></div><div className="two-col-grid"><div className="am-table-wrapper"><table className="am-table"><thead><tr><th>Recent Order</th><th>Employee</th><th>Points</th><th>Status</th></tr></thead><tbody>{orders.slice(0,8).map(o=><tr key={o.id} className="clickable" onClick={()=>{setModalData(o);setActiveModal('ORDER')}}><td className="mono">{o.orderNumber}</td><td>{o.staffName||o.skId}</td><td>{o.totalPoints}</td><td><StatusBadge value={o.status}/></td></tr>)}{!orders.length&&<tr><td colSpan="4">No Uniform orders.</td></tr>}</tbody></table></div><div style={{display:'grid',gap:'10px'}}><Gate title="Transactional Stock" text="Catalog status is live. Physical warehouse/bin quantities remain gated by the canonical backend." code={`transactionalStock = ${String(capabilities.transactionalStock===true)}`}/><Gate title="Payroll Handoff" text="Payroll deduction fields are visible on Uniform orders, but actual payroll processing remains outside Uniform authority." code={`payrollDeductionHandoff = ${String(capabilities.payrollDeductionHandoff===true)}`}/></div></div></div></div>;
  };

  return (
    <div className="app-shell">
      <nav className="global-nav">
        
        <UniformLogo url={logoUrl} />

        <div style={{height:'16px'}}></div>
        <div className={`nav-item ${activeMainTab === 'home' ? 'active' : ''}`} onClick={() => handleMainTabChange('home')}><Icon name="layout-dashboard"/></div>

        <div className={`nav-item ${activeMainTab === 'products' ? 'active' : ''}`} onClick={() => handleMainTabChange('products')}><Icon name="layers"/></div>
        <div className={`nav-item ${activeMainTab === 'inventory' ? 'active' : ''}`} onClick={() => handleMainTabChange('inventory')}><Icon name="package"/></div>
        <div className={`nav-item ${activeMainTab === 'purchasing' ? 'active' : ''}`} onClick={() => handleMainTabChange('purchasing')}><Icon name="file-text"/></div>
        <div className={`nav-item ${activeMainTab === 'orders' ? 'active' : ''}`} onClick={() => handleMainTabChange('orders')}><Icon name="shopping-bag"/></div>
        <div className={`nav-item ${activeMainTab === 'employees' ? 'active' : ''}`} onClick={() => handleMainTabChange('employees')}><Icon name="users"/></div>
      </nav>

      {(activeMainTab === 'products' || activeMainTab === 'employees') && <SidebarFilter />}

      <main className="main-content">
        <div className="top-tabs-bar">
          <div className="tabs-container">
            {subTabsConfig[activeMainTab]?.map(subTab => (
              <button key={subTab} className={`am-tab ${activeSubTabs[activeMainTab] === subTab ? 'active' : ''}`} onClick={() => handleSubTabChange(subTab)}>{subTab}</button>
            ))}
          </div>
          <div style={{height:'100%',display:'flex',alignItems:'center',gap:'8px',paddingLeft:'12px'}}>
            <span style={{fontSize:'9px',fontWeight:'800',color:isSyncing?'#a15c00':error?'#b42318':'#18794e'}}>{isSyncing?'SYNCING':error?'ERROR':'LIVE'}</span>
            <span className="mono" style={{fontSize:'9px',color:'var(--am-text-light)'}}>{data.version||'B-011 UNIFORM'}</span>
          </div>
        </div>

        {error && <div style={{padding:'9px 16px',background:'#fff0ee',borderBottom:'1px solid #ffcdd2',color:'#b42318',fontWeight:'700'}}>{error}</div>}
        {notice && !error && <div style={{padding:'7px 16px',background:'#edf8f2',borderBottom:'1px solid #c8e6c9',color:'#18794e',fontWeight:'700'}}>{notice}</div>}

        {activeMainTab === 'home' && renderHome()}
        {activeMainTab === 'products' && renderProducts()}
        {activeMainTab === 'inventory' && renderInventory()}
        {activeMainTab === 'purchasing' && renderPurchasing()}
        {activeMainTab === 'orders' && renderOrders()}
        {activeMainTab === 'employees' && renderEmployees()}
        {isSyncing && <div className="sync-overlay"><div className="spinner"></div><div style={{fontWeight:'800', color:'var(--am-blue)'}}>Synchronizing Uniform Control...</div></div>}
      </main>

      {activeModal === 'EDIT_STYLE' && <MasterStyleEditModal />}
      {activeModal === 'CATEGORY' && <CategoryModal />}
      {activeModal === 'RULE' && <RuleModal rule={modalData} />}
      {activeModal === 'POLICY' && <PolicyModal />}
      {activeModal === 'WALLET_ADJUST' && <WalletAdjustModal />}
      {activeModal === 'ORDER' && <OrderModal />}
      {activeModal === 'EMPLOYEE_PROFILE' && <EmployeeProfileModal />}
      {activeModal === 'SCHEMA_ACTION' && <SchemaActionModal />}
      {activeModal === 'BARCODE' && <BarcodeModal />}
      {searchOpen && <GlobalSearchModal />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
