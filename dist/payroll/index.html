<style data-skandi-part="header">
#riaintra-global-header-root {
  --shell-h: 52px;
  --shell: #354a5f;
  --shell-hover: rgba(255, 255, 255, 0.14);
  --blue: #106ebe;
  --canvas: #ffffff;
  --text: #323130;
  --border: #edebe9;
  --font: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}

#riaintra-global-header-root * { box-sizing: border-box; }
#riaintra-global-header-root,#riaintra-global-header-root {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  color: var(--text);
  background: transparent;
  font-size: 14px;
  user-select: none;
}
#riaintra-global-header-root button { font: inherit; border: 0; background: transparent; color: inherit; cursor: pointer; }

/* Desktop Shellbar */
#riaintra-global-header-root .shellbar {
  position: fixed;
  inset: 0 0 auto;
  height: var(--shell-h);
  background: var(--shell);
  color: #fff;
  z-index: 1000;
  box-shadow: 0 1px 2px rgba(34, 54, 73, 0.12);
}
#riaintra-global-header-root .shellbar-inner {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  gap: 12px;
}
#riaintra-global-header-root .shell-left, #riaintra-global-header-root .shell-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

/* Branding */
#riaintra-global-header-root .product {
  display: flex;
  align-items: center;
  gap: 10px;
}
#riaintra-global-header-root .product img {
  height: 30px;
  width: auto;
  object-fit: contain;
  border-radius: 3px;
  display: none;
}
#riaintra-global-header-root .product img[src] {
  display: block;
}
#riaintra-global-header-root .product-text strong {
  display: block;
  font-size: 13px;
}
#riaintra-global-header-root .product-text small {
  display: block;
  color: rgba(255, 255, 255, 0.7);
  font-size: 10px;
  margin-top: 2px;
}

/* Desktop Navigation */
#riaintra-global-header-root .shell-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1 1 auto;
  justify-content: flex-start;
  padding-left: 24px;
}
#riaintra-global-header-root .shell-nav button {
  color: rgba(255, 255, 255, 0.82);
  font-size: 13px;
  font-weight: 600;
  padding: 8px 10px;
  border-radius: 4px;
  transition: all 0.15s ease;
  white-space: nowrap;
}
#riaintra-global-header-root .shell-nav button:hover, #riaintra-global-header-root .shell-nav button.active {
  color: #fff;
  background: var(--shell-hover);
}

/* Session / Dashboard Actions */
#riaintra-global-header-root .utility-action {
  min-height: 32px;
  padding: 0 10px;
  border: 1px solid rgba(255,255,255,.20);
  border-radius: 4px;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}
#riaintra-global-header-root .utility-action:hover { background: var(--shell-hover); }
#riaintra-global-header-root .utility-action[hidden] { display: none !important; }

/* Clock */
#riaintra-global-header-root .clock {
  min-width: 110px;
  text-align: right;
  border-inline: 1px solid rgba(255, 255, 255, 0.18);
  padding: 4px 10px;
  cursor: pointer;
}
#riaintra-global-header-root .clock strong {
  display: block;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
#riaintra-global-header-root .clock small {
  display: block;
  color: rgba(255, 255, 255, 0.7);
  font-size: 9px;
  margin-top: 3px;
  text-transform: uppercase;
}

/* User Profile */
#riaintra-global-header-root .profile {
  display: none;
  grid-template-columns: minmax(150px, 230px) 38px;
  grid-template-rows: repeat(3, auto);
  column-gap: 9px;
  row-gap: 1px;
  align-items: center;
  min-width: 0;
}
#riaintra-global-header-root .profile-name,
#riaintra-global-header-root .profile-meta,
#riaintra-global-header-root .profile-email {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: right;
}
#riaintra-global-header-root .profile-name {
  grid-column: 1;
  grid-row: 1;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}
#riaintra-global-header-root .profile-meta {
  grid-column: 1;
  grid-row: 2;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
}
#riaintra-global-header-root .profile-email {
  grid-column: 1;
  grid-row: 3;
  color: rgba(255,255,255,.70);
  font-size: 9px;
}
#riaintra-global-header-root .profile-avatar {
  grid-column: 2;
  grid-row: 1 / span 3;
  width: 38px;
  height: 38px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  background: #d1e8ff;
  color: #073b69;
  font-size: 11px;
  font-weight: 800;
  overflow: hidden;
}
#riaintra-global-header-root .profile-avatar img,
#riaintra-global-header-root img.profile-avatar {
  width: 38px;
  height: 38px;
  object-fit: cover;
}

/* Mobile Burger Icon */

#riaintra-global-header-root .burger {
  display: none;
  width: 36px;
  height: 36px;
  color: #fff;
  border-radius: 4px;
}
#riaintra-global-header-root .burger:hover {
  background: var(--shell-hover);
}

/* Mobile Drawer (Horizontal Slider) */
#riaintra-global-header-root .mobile-drawer {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 1100;
  width: 100%;
  height: var(--shell-h);
  background: var(--shell);
  color: #fff;
  box-shadow: -20px 0 45px rgba(13, 31, 48, 0.25);
  transform: translateX(102%);
  opacity: 0.98;
  transition: transform 0.44s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
  display: flex;
  align-items: center;
}
#riaintra-global-header-root .mobile-drawer.open {
  transform: translateX(0);
  opacity: 1;
}

/* Mobile Drawer Title Area */
#riaintra-global-header-root .mobile-head {
  height: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px 0 18px;
  border-right: 1px solid rgba(255, 255, 255, 0.18);
  flex: 0 0 auto;
}
#riaintra-global-header-root .mobile-head strong { font-size: 13px; }
#riaintra-global-header-root .mobile-head .close {
  width: 28px;
  height: 28px;
  font-size: 22px;
  display: grid;
  place-items: center;
}

/* Mobile Drawer Nav List */
#riaintra-global-header-root .mobile-nav {
  height: 100%;
  display: flex;
  align-items: center;
  overflow-x: auto;
  scrollbar-width: none;
  flex: 1;
  padding: 0 12px;
  gap: 4px;
}
#riaintra-global-header-root .mobile-nav::-webkit-scrollbar { display: none; }
#riaintra-global-header-root .mobile-nav button {
  display: block;
  width: auto;
  white-space: nowrap;
  padding: 8px 12px;
  font-weight: 600;
  border-radius: 4px;
}
#riaintra-global-header-root .mobile-nav button:hover, #riaintra-global-header-root .mobile-nav button.active {
  background: var(--shell-hover);
}

/* Mobile Overlay */
#riaintra-global-header-root .overlay {
  position: fixed;
  inset: var(--shell-h) 0 0 0;
  background: rgba(7, 27, 68, 0.46);
  z-index: 1090;
  display: none;
}
#riaintra-global-header-root .overlay.show { display: block; }

body[data-theme="dark"] #riaintra-global-header-root {
  --canvas: #1f1f1f;
  --border: #3a3a3a;
  --text: #f3f2f1;
}

@media(max-width: 950px) {
  #riaintra-global-header-root .shell-nav { display: none; }
  #riaintra-global-header-root .burger { display: grid; place-items: center; }
  #riaintra-global-header-root .profile-email { display: none; }
}
@media(max-width: 700px) {
  #riaintra-global-header-root .profile { display: none !important; }
  #riaintra-global-header-root .clock { display: none; }
  #riaintra-global-header-root .utility-action { padding: 0 8px; font-size: 9px; }
}
</style>
<style data-skandi-part="footer">

#riaintra-global-footer-root,#riaintra-global-footer-root {

</style>

const SKANDI_SHELL_SOURCE = 'SKANDI_SHELL';
const SKANDI_SHELL_PARENT = 'SKANDI_WIX_PARENT';
const shellRoot = document.getElementById('skandi-shell-root');
if (!shellRoot) throw new Error('SKANDI shell mount missing');
window.__SKANDI_SHELL__ = Object.freeze({
  mode:'compiled-single-embed',
  page:shellRoot.dataset.skandiPage || '',
  root:shellRoot
});
// A single iframe passes Home, Header, Footer and Mobile messages to the
// same Wix Velo HtmlComponent. Existing message source/type values remain.
// The Wix master controller supplies canonical route and session data.
window.addEventListener('message', event => {
  if (event.source !== window.parent) return;
  let message = event.data;
  if (typeof message === 'string') {
    try { message = JSON.parse(message); } catch (_) { return; }
  }
  if (!message || message.source !== SKANDI_SHELL_PARENT) return;
  if (message.type === 'SKANDI_MASTER_CONFIG') {
    shellRoot.dataset.skandiPath = String(message.payload?.currentPath || '/');
  }
  if (message.type === 'SKANDI_SCROLL_TOP' || message.type === 'MASTER_SCROLL_TOP') {
    document.getElementById('skandi-app-root')?.scrollTo({ top:0, behavior:'instant' });
  }
});
window.parent?.postMessage({
  source:SKANDI_SHELL_SOURCE,
  type:'SKANDI_SHELL_READY',
  payload:{page:shellRoot.dataset.skandiPage || ''},
  timestamp:new Date().toISOString()
}, '*');

// The universal receiver supplies this context only after canonical parent,
// manifest and digest validation. Legacy Home never opts into this handshake.
let shellAttempts = 0;
let shellConfigReceived = false;
let shellTimer;
function requestShellConfig() {
  if (++shellAttempts > 40 || shellConfigReceived) { clearInterval(shellTimer); return; }
  window.parent.postMessage({source:SKANDI_SHELL_SOURCE,type:'MASTER_CONFIG_REQUEST',payload:{context:'compiled-shell'}},'*');
}
window.addEventListener('message', event => {
  if (event.source !== window.parent) return;
  let message=event.data;
  if(typeof message==='string'){try{message=JSON.parse(message);}catch(_){return;}}
  if(message?.source===SKANDI_SHELL_PARENT && message.type==='SKANDI_MASTER_CONFIG') {
    shellConfigReceived=true;clearInterval(shellTimer);
  }
});
function startCompiledShell() {
  const context=window.__SKANDI_RECEIVER_CONTEXT__;
  if(context?.allowed===true && context.key===shellRoot.dataset.skandiKey) {
    window.parent.postMessage({source:SKANDI_SHELL_SOURCE,type:'SKANDI_COMPILED_READY',payload:{key:context.key}},'*');
  }
  shellTimer=setInterval(requestShellConfig,500);requestShellConfig();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startCompiledShell,{once:true});
else startCompiledShell();
</script>
<script data-skandi-part="header">(function(){
const __root=window.document.getElementById("riaintra-global-header-root");
const document=new Proxy(window.document,{get(target,key){if(key==='getElementById')return id=>{const el=target.getElementById(id);return el&&(__root===el||__root.contains(el))?el:null;};if(key==='querySelector'||key==='querySelectorAll')return selector=>{if(/^(?:html|body|head|meta|title|link)(?:[\s.#[:]|$)/i.test(selector)&&!selector.includes(' '))return target[key](selector);return __root[key](selector);};if(key==='getElementsByClassName'||key==='getElementsByTagName')return value=>__root[key](value);const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;},set(target,key,value){return Reflect.set(target,key,value,target);}});

(()=>{
  "use strict";
  
  const SOURCE = "SKANDI_RIAINTRA_HEADER";
  const PARENT = "SKANDI_WIX_PARENT";

  let config = null;
  let staff = {};

  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
  }[s]));

  function post(type, payload = {}) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        source: SOURCE,
        type,
        payload,
        timestamp: new Date().toISOString()

    }
  }

  // Mobile Menu Logic
  function closeMenu() {
    $("mobileDrawer")?.classList.remove("open");
    $("drawerOverlay")?.classList.remove("show");
    /* Compiled shell owns internal chrome geometry. */
  }

  $("burger")?.addEventListener("click", (e) => {
    e.stopPropagation();
    const menu = $("mobileDrawer");
    const overlay = $("drawerOverlay");
    
    menu.classList.toggle("open");
    overlay.classList.toggle("show");
    
    if (menu.classList.contains("open")) {
      // Command Wix to expand iframe slightly so the dark overlay shows
      /* Compiled shell owns internal chrome geometry. */ 
    } else {
      /* Compiled shell owns internal chrome geometry. */
    }
  });

  $("drawerClose")?.addEventListener("click", closeMenu);
  $("drawerOverlay")?.addEventListener("click", closeMenu);

  // Render Data
  function render() {
    // 1. Branding
    const header = config?.internal?.header || {};
    const logo = config?.brand?.assets?.logos?.riaHeader || "";
    
    if (logo && $("logo")) $("logo").src = logo;
    if (header.productName && $("riaintra-header-productName")) $("riaintra-header-productName").textContent = header.productName;
    const language = String(config?.settings?.language || "EN").trim().toLowerCase();
    const slogans = config?.brand?.slogans?.riaintra || {};
    if ($("productContext")) $("productContext").textContent = slogans[language] || slogans.en || header.productContext || "";

    // 2. Navigation
    const current = config?.currentPath || "";
    const items = header.primaryNav || config?.nav || [];
    
    if (Array.isArray(items) && items.length > 0) {
      const markup = items.map(i => {
        const active = current === i.path || (i.path && current.startsWith(i.path + "/"));
        return `<button type="button" class="${active ? "active" : ""}" data-path="${esc(i.path)}">${esc(i.label)}</button>`;
      }).join("");
      
      if ($("riaintra-header-desktopNav")) $("riaintra-header-desktopNav").innerHTML = markup;
      if ($("riaintra-header-mobileNav")) $("riaintra-header-mobileNav").innerHTML = markup;
    }

    // 3. Canonical staff profile from Wix parent -> SKANDI_CORE/staffAuth -> Supabase agent_users.
    const p = staff.profile || config?.staff?.profile || {};
    const full =
      p.displayName || p.display_name || p.fullName || p.name ||
      [p.firstName || p.first_name, p.lastName || p.last_name].filter(Boolean).join(" ") ||
      "Employee";
    const skId = String(p.skId || p.skID || p.sk_id || p.employeeId || p.employee_id || "").trim().toUpperCase();
    const baseCode = String(p.baseCode || p.base_code || p.base || p.station || "").trim().toUpperCase();
    const corporateEmail = String(
      p.corporateEmail || p.corporate_email || p.corporateEmailAddress ||
      p.corporate_email_address || p.workEmail || p.email || ""
    ).trim();
    const photo = String(
      p.badgePhotoUrl || p.badge_photo_url || p.photoUrl ||
      p.profilePhotoUrl || p.photo || ""
    ).trim();
    const hasData = Boolean(skId || full !== "Employee" || corporateEmail || photo);

    if ($("userProfile")) $("userProfile").style.display = hasData ? "grid" : "none";

    if (hasData) {
      const initials = [p.firstName || p.first_name, p.lastName || p.last_name]
        .filter(Boolean).map(v => String(v)[0]).join("").slice(0, 2).toUpperCase() ||

      if ($("userEmail")) $("userEmail").textContent = corporateEmail || "—";

      if (photo) {
        $("badge_photo_url").src = photo;
        $("badge_photo_url").style.display = "block";
        $("avatarFallback").style.display = "none";
      } else {
        $("badge_photo_url").style.display = "none";
        $("avatarFallback").style.display = "grid";
        $("avatarFallback").textContent = initials;
      }
    }

    // Return to Dashboard is hidden only on the Success Factors dashboard itself.
    const normalizedCurrent = String(current || "").split("?")[0].replace(/\/$/, "") || "/";
    if ($("returnDashboardBtn")) {
      $("returnDashboardBtn").hidden = normalizedCurrent === "/riaintra/success-factors";
    }
  }

  // Navigation Logic
  document.addEventListener("click", e => {
    const btn = e.target.closest("[data-path]");
    if (!btn) return;
    
    const path = btn.dataset.path;
    
    // Update local active state visually
    document.querySelectorAll("[data-path]").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(`[data-path="${path}"]`).forEach(b => b.classList.add("active"));
    
    if (config) config.currentPath = path;

    closeMenu();
    post("RIAINTRA_NAVIGATE", { path });
  });

  $("returnDashboardBtn")?.addEventListener("click", () => {
    post("RIAINTRA_NAVIGATE", {
      path:config?.routes?.successFactors || "/riaintra/success-factors"
    });
  });

  $("logoutBtn")?.addEventListener("click", () => {
    post("RIAINTRA_LOGOUT", {});
  });

  // Clock Logic
  let clockUsesUtc = false;
  function updateClock() {
    const now = new Date();
    const opts = {
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
      ...(clockUsesUtc ? { timeZone: "UTC" } : {})
    };
    if ($("sfClockTime")) $("sfClockTime").textContent = new Intl.DateTimeFormat(undefined, opts).format(now);
    if ($("sfClockDate")) $("sfClockDate").textContent = clockUsesUtc 
      ? `${now.toISOString().slice(0, 10)} UTC` 
      : new Intl.DateTimeFormat(undefined, { weekday: "short", day: "2-digit", month: "short" }).format(now).toUpperCase();
  }

  $("sfClock")?.addEventListener("click", () => {
    clockUsesUtc = !clockUsesUtc;
    updateClock();
  });
  
  setInterval(updateClock, 1000);
  updateClock();

  // Listen for Wix Parent Messages
  window.addEventListener("message", e => {
    const m = e.data || {};
    if (m.source !== PARENT) return;

    if (m.type === "SKANDI_MASTER_CONFIG") {
      config = m.payload || {};
      render();
    }

    if ([
      "RIAINTRA_HEADER_STATE",
      "UPDATE_PROFILE",
      "INTERNAL_CHROME_BOOTSTRAP",
      "GLOBAL_HEADER_BOOTSTRAP"
    ].includes(m.type)) {
      const payloadProfile =
        m.payload?.profile ||
        m.payload?.session?.profile ||
        m.payload?.session ||
        m.payload ||
        {};
      staff.profile = { ...staff.profile, ...payloadProfile };
      render();
    }
  });

  // Signal Wix parent window that embed is ready
  post("MASTER_CONFIG_REQUEST", { context: "riaintra-header" });
  post("RIAINTRA_HEADER_READY", {});
  /* Compiled shell owns internal chrome geometry. */

})();


})();</script>

function renderHome(){const p=selfProfile(),sl=arr(state.data?.self?.payslips),latest=sl[0],a=state.data?.admin;$("view").innerHTML=`<section class="grid grid4"><article class="card kpi"><small>Payroll mode</small><strong>${admin()?"ADMIN":"SELF"}</strong><span>Permission-preset controlled</span></article><article class="card kpi"><small>Currency</small><strong>${esc(p?.currency||"—")}</strong><span>${esc(p?.taxRegion||"No jurisdiction")}</span></article><article class="card kpi"><small>Latest Net</small><strong>${money(latest?.netPay||0,latest?.currency||p?.currency||"USD")}</strong><span>${esc(latest?.status||"No payslip")}</span></article><article class="card kpi"><small>Payroll Profile</small><strong>${p?.payrollEnabled?"ACTIVE":"—"}</strong><span>${esc(p?.bankStatus||"Not initialized")}</span></article></section><section class="grid grid2 section-gap"><article class="card"><div class="card-head"><div><h2>My payroll</h2><p>Employee self-service</p></div><span class="status ${p?.payrollEnabled?'good':'warn'}">${p?.payrollEnabled?'Active':'Not active'}</span></div><div class="card-body">${p?`<div class="summary"><div><span>Employee</span><strong>${esc(p.displayName)}</strong></div><div><span>SK-ID</span><strong>${esc(p.skId)}</strong></div><div><span>Employment type</span><strong>${esc(p.employmentType)}</strong></div><div><span>Currency</span><strong>${esc(p.currency)}</strong></div><div><span>Tax region</span><strong>${esc(p.taxRegion||'—')}</strong></div><div><span>Bank status</span><strong>${esc(p.bankStatus)}</strong></div></div>`:`<div class="empty"><strong>No payroll profile</strong>SuccessFactors must provide the employee and jurisdiction master data before Payroll setup can be completed.</div>`}</div></article><article class="card"><div class="card-head"><div><h2>Authority model</h2><p>B-008 convergence</p></div><span class="status good">Payroll-owned</span></div><div class="card-body"><div class="notice">SuccessFactors owns organization, position, manager and jurisdiction master data. Payroll consumes that master data and owns compensation, rates, payroll enablement, periods, run amounts, adjustments, finalization and provider export state. Payroll does not overwrite SuccessFactors-owned fields.</div>${admin()?`<div class="notice warn section-gap">Run creation intentionally does not invent a pay formula. Every employee line begins with zero amounts and must receive explicit controlled values before finalization.</div>`:""}</div></article></section>${admin()?`<section class="grid grid4 section-gap"><article class="card kpi"><small>Profiles</small><strong>${profiles().length}</strong><span>Live backend rows</span></article><article class="card kpi"><small>Periods</small><strong>${periods().length}</strong><span>No sample periods</span></article><article class="card kpi"><small>Runs</small><strong>${runs().length}</strong><span>No sample runs</span></article><article class="card kpi"><small>Pending Lines</small><strong>${lines().filter(x=>x.status!=="calculated").length}</strong><span>Require explicit amounts</span></article></section>`:""}`}
function renderPayslips(){const p=selfProfile(),sl=arr(state.data?.self?.payslips);$("view").innerHTML=`<section class="card"><div class="card-head"><div><h2>My Payslips</h2><p>${esc(p?.displayName||"Employee")}</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Status</th><th>Hours</th><th>Earnings</th><th>Deductions</th><th>Net</th></tr></thead><tbody>${sl.map(x=>`<tr><td>${esc((x.createdAt||"").slice(0,10)||'—')}</td><td><span class="status ${x.status==='calculated'?'good':'warn'}">${esc(x.status)}</span></td><td>${esc(x.hours)}</td><td>${money(x.earnings,x.currency)}</td><td>${money(x.deductions,x.currency)}</td><td><strong>${money(x.netPay,x.currency)}</strong></td></tr>`).join("")||`<tr><td colspan="6"><div class="empty"><strong>No payroll results</strong>No payroll run lines have been returned for your profile.</div></td></tr>`}</tbody></table></div></section>`}

function renderEmployees(){if(!admin())return setView("home");const rows=filteredProfiles(),sel=profiles().find(x=>x.id===state.selectedProfileId)||rows[0]||null;if(sel&&!state.selectedProfileId)state.selectedProfileId=sel.id;$("view").innerHTML=`<section class="grid grid2"><article class="card"><div class="card-head"><div><h2>Payroll Profiles</h2><p>${rows.length} live profiles</p></div></div><div class="card-body"><div class="toolbar"><input id="profileSearch" class="input" value="${esc(state.query)}" placeholder="Search employee or SK-ID"></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>SK-ID</th><th>Currency</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr data-id="${esc(x.id)}" class="${state.selectedProfileId===x.id?'selected':''}"><td>${esc(x.displayName)}</td><td>${esc(x.skId)}</td><td>${esc(x.currency)}</td><td><span class="status ${x.payrollEnabled?'good':'warn'}">${x.payrollEnabled?'Enabled':'Disabled'}</span></td></tr>`).join("")||`<tr><td colspan="4"><div class="empty"><strong>No profiles</strong>No payroll profiles were returned.</div></td></tr>`}</tbody></table></div></article><article class="card"><div class="card-head"><div><h2>Payroll setup</h2><p>Payroll-owned fields</p></div>${sel?`<span class="status good">${esc(sel.currency)}</span>`:""}</div><div class="card-body">${sel?`<form id="profileForm" class="form"><div class="field full"><label>Employee</label><input value="${esc(sel.displayName)} · ${esc(sel.skId)}" disabled></div><div class="field"><label>Employment type</label><input id="employmentType" value="${esc(sel.employmentType)}"></div><div class="field"><label>Payroll enabled</label><select id="payrollEnabled"><option value="true" ${sel.payrollEnabled?'selected':''}>Enabled</option><option value="false" ${!sel.payrollEnabled?'selected':''}>Disabled</option></select></div><div class="field"><label>Base salary / configured amount</label><input id="baseSalary" type="number" min="0" step="0.01" value="${esc(sel.baseSalary)}"></div><div class="field"><label>Hourly rate</label><input id="hourlyRate" type="number" min="0" step="0.01" value="${esc(sel.hourlyRate)}"></div><div class="field"><label>Standard hours</label><input id="standardHours" type="number" min="0" step="0.01" value="${esc(sel.standardHours)}"></div><div class="field"><label>Bank status</label><input id="bankStatus" value="${esc(sel.bankStatus)}"></div><div class="field"><label>Currency (SuccessFactors jurisdiction)</label><input value="${esc(sel.currency)}" disabled></div><div class="field"><label>Tax region (SuccessFactors jurisdiction)</label><input value="${esc(sel.taxRegion||'—')}" disabled></div><div class="field full"><label>Payroll note</label><textarea id="payrollNote">${esc(sel.payrollNote||'')}</textarea></div><div class="field full"><button class="btn primary" type="submit">Save Payroll Profile</button></div></form>`:`<div class="empty"><strong>Select a profile</strong>Choose an employee payroll profile.</div>`}</div></article></section>`;const s=$("profileSearch");s?.addEventListener("input",e=>{state.query=e.target.value;renderEmployees()});document.querySelectorAll("tr[data-id]").forEach(r=>r.addEventListener("click",()=>{state.selectedProfileId=r.dataset.id;renderEmployees()}));$("profileForm")?.addEventListener("submit",e=>{e.preventDefault();busy(true);post("PAYROLL_SAVE_PROFILE",{id:sel.id,employmentType:$("employmentType").value,payrollEnabled:$("payrollEnabled").value==="true",baseSalary:$("baseSalary").value,hourlyRate:$("hourlyRate").value,standardHours:$("standardHours").value,bankStatus:$("bankStatus").value,payrollNote:$("payrollNote").value})})}
function renderPeriods(){if(!admin())return setView("home");const ps=periods(),rs=runs(),selP=ps.find(x=>x.id===state.selectedPeriodId)||ps[0]||null;if(selP&&!state.selectedPeriodId)state.selectedPeriodId=selP.id;$("view").innerHTML=`<section class="grid grid2"><article class="card"><div class="card-head"><div><h2>Payroll periods</h2><p>Create controlled processing windows</p></div></div><div class="card-body"><form id="periodForm" class="form"><div class="field"><label>Period code</label><input id="periodCode" placeholder="SEK-2026-09"></div><div class="field"><label>Currency</label><input id="periodCurrency" maxlength="3" placeholder="SEK"></div><div class="field"><label>Start date</label><input id="periodStart" type="date"></div><div class="field"><label>End date</label><input id="periodEnd" type="date"></div><div class="field full"><button class="btn primary" type="submit">Create Period</button></div></form></div><div class="table-wrap"><table class="table"><thead><tr><th>Code</th><th>Dates</th><th>Currency</th><th>Status</th></tr></thead><tbody>${ps.map(x=>`<tr data-period="${esc(x.id)}" class="${state.selectedPeriodId===x.id?'selected':''}"><td>${esc(x.periodCode)}</td><td>${esc(x.startDate)} → ${esc(x.endDate)}</td><td>${esc(x.currency)}</td><td><span class="status">${esc(x.status)}</span></td></tr>`).join("")||`<tr><td colspan="4"><div class="empty"><strong>No periods</strong>Create the first live payroll period.</div></td></tr>`}</tbody></table></div></article><article class="card"><div class="card-head"><div><h2>Payroll runs</h2><p>Run shells contain no assumed pay formula</p></div>${selP?`<button class="btn primary" data-action="create-run">Create Run</button>`:""}</div><div class="table-wrap"><table class="table"><thead><tr><th>Run</th><th>Period</th><th>Status</th><th>Gross</th><th>Net</th></tr></thead><tbody>${rs.map(x=>`<tr data-run="${esc(x.id)}" class="${state.selectedRunId===x.id?'selected':''}"><td>${esc(x.runCode)}</td><td>${esc(x.periodCode)}</td><td><span class="status ${x.status==='finalized'?'good':'warn'}">${esc(x.status)}</span></td><td>${money(x.grossTotal,x.currency)}</td><td>${money(x.netTotal,x.currency)}</td></tr>`).join("")||`<tr><td colspan="5"><div class="empty"><strong>No runs</strong>Create a run from an open payroll period.</div></td></tr>`}</tbody></table></div></article></section>`;$("periodForm")?.addEventListener("submit",e=>{e.preventDefault();busy(true);post("PAYROLL_CREATE_PERIOD",{periodCode:$("periodCode").value,currency:$("periodCurrency").value,startDate:$("periodStart").value,endDate:$("periodEnd").value})});document.querySelectorAll("tr[data-period]").forEach(r=>r.addEventListener("click",()=>{state.selectedPeriodId=r.dataset.period;renderPeriods()}));document.querySelectorAll("tr[data-run]").forEach(r=>r.addEventListener("click",()=>{state.selectedRunId=r.dataset.run;setView("run-lines")}))}
function selectedRun(){return runs().find(x=>x.id===state.selectedRunId)||runs()[0]||null}function renderRunLines(){if(!admin())return setView("home");const run=selectedRun();if(run&&!state.selectedRunId)state.selectedRunId=run.id;const ls=run?lines().filter(x=>x.payrollRunId===run.id):[],sel=ls.find(x=>x.id===state.selectedLineId)||ls[0]||null;if(sel&&!state.selectedLineId)state.selectedLineId=sel.id;$("view").innerHTML=`<section class="card"><div class="card-head"><div><h2>${esc(run?.runCode||"No run selected")}</h2><p>${run?`${esc(run.periodCode)} · ${esc(run.currency)} · ${ls.length} lines`:"Select a run in Periods & Runs"}</p></div>${run&&run.status!=="finalized"?`<button class="btn primary" data-action="finalize-run">Finalize Run</button>`:""}</div>${run?`<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Hours</th><th>Earnings</th><th>Deductions</th><th>Net</th><th>Status</th></tr></thead><tbody>${ls.map(x=>`<tr data-line="${esc(x.id)}" class="${state.selectedLineId===x.id?'selected':''}"><td>${esc(x.displayName)}<br><small>${esc(x.skId)}</small></td><td>${esc(x.hours)}</td><td>${money(x.earnings,x.currency)}</td><td>${money(x.deductions,x.currency)}</td><td><strong>${money(x.netPay,x.currency)}</strong></td><td><span class="status ${x.status==='calculated'?'good':'warn'}">${esc(x.status)}</span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><strong>No run selected</strong>Open Periods & Runs first.</div>`}</section>${sel&&run?.status!=="finalized"?`<section class="card section-gap"><div class="card-head"><div><h2>Edit run line</h2><p>Explicit controlled values only</p></div></div><div class="card-body"><form id="lineForm" class="form"><div class="field full"><label>Employee</label><input value="${esc(sel.displayName)} · ${esc(sel.skId)}" disabled></div><div class="field"><label>Hours</label><input id="lineHours" type="number" min="0" step="0.01" value="${esc(sel.hours)}"></div><div class="field"><label>Earnings</label><input id="lineEarnings" type="number" min="0" step="0.01" value="${esc(sel.earnings)}"></div><div class="field"><label>Deductions</label><input id="lineDeductions" type="number" min="0" step="0.01" value="${esc(sel.deductions)}"></div><div class="field"><label>Net (derived)</label><input value="${esc(Math.max(0,(Number(sel.earnings)||0)-(Number(sel.deductions)||0)))}" disabled></div><div class="field full"><div class="notice warn">B-008 does not guess whether base salary is annual, monthly or per-period. Payroll staff must supply the controlled run amount or a later approved calculation provider must do so.</div></div><div class="field full"><button class="btn primary" type="submit">Save Run Line</button></div></form></div></section>`:""}`;document.querySelectorAll("tr[data-line]").forEach(r=>r.addEventListener("click",()=>{state.selectedLineId=r.dataset.line;renderRunLines()}));$("lineForm")?.addEventListener("submit",e=>{e.preventDefault();busy(true);post("PAYROLL_SAVE_RUN_LINE",{id:sel.id,hours:$("lineHours").value,earnings:$("lineEarnings").value,deductions:$("lineDeductions").value})})}
function renderAdjustments(){if(!admin())return setView("home");const a=arr(state.data?.admin?.adjustments),p=profiles();$("view").innerHTML=`<section class="grid grid2"><article class="card"><div class="card-head"><div><h2>New Adjustment</h2><p>Payroll-owned control</p></div></div><div class="card-body"><form id="adjForm" class="form"><div class="field full"><label>Employee</label><select id="adjProfile"><option value="">Select employee</option>${p.map(x=>`<option value="${esc(x.id)}">${esc(x.displayName)} · ${esc(x.skId)}</option>`).join("")}</select></div><div class="field"><label>Type</label><input id="adjType" value="OTHER"></div><div class="field"><label>Amount</label><input id="adjAmount" type="number" step="0.01" value="0"></div><div class="field"><label>Taxable</label><select id="adjTaxable"><option value="true">Yes</option><option value="false">No</option></select></div><div class="field"><label>Run</label><select id="adjRun"><option value="">Not linked</option>${runs().map(x=>`<option value="${esc(x.id)}">${esc(x.runCode)}</option>`).join("")}</select></div><div class="field full"><label>Reason</label><textarea id="adjReason"></textarea></div><div class="field full"><button class="btn primary" type="submit">Save Adjustment</button></div></form></div></article><article class="card"><div class="card-head"><div><h2>Adjustments</h2><p>${a.length} live records</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Type</th><th>Amount</th><th>Taxable</th><th>Status</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.skId||x.staffKey)}</td><td>${esc(x.adjustmentType)}</td><td>${esc(x.amount)}</td><td>${x.taxable?'Yes':'No'}</td><td>${esc(x.status)}</td></tr>`).join("")||`<tr><td colspan="5"><div class="empty"><strong>No adjustments</strong>No live adjustment records.</div></td></tr>`}</tbody></table></div></article></section>`;$("adjForm")?.addEventListener("submit",e=>{e.preventDefault();const prof=p.find(x=>x.id===$("adjProfile").value);if(!prof){toast("Select an employee.");return}const run=runs().find(x=>x.id===$("adjRun").value);busy(true);post("PAYROLL_SAVE_ADJUSTMENT",{staffKey:prof.staffKey,agentUserId:prof.agentUserId,skId:prof.skId,adjustmentType:$("adjType").value,amount:$("adjAmount").value,taxable:$("adjTaxable").value==="true",payrollRunId:run?.id||"",payrollPeriodId:run?.payrollPeriodId||"",reason:$("adjReason").value,status:"DRAFT"})})}
function renderExports(){if(!admin())return setView("home");const ex=arr(state.data?.admin?.exports),finalized=runs().filter(x=>x.status==="finalized");$("view").innerHTML=`<section class="grid grid2"><article class="card"><div class="card-head"><div><h2>Create Provider Export</h2><p>File generation only; no external provider API call is claimed</p></div></div><div class="card-body"><form id="exportForm" class="form"><div class="field full"><label>Finalized run</label><select id="exportRun"><option value="">Select run</option>${finalized.map(x=>`<option value="${esc(x.id)}">${esc(x.runCode)} · ${esc(x.currency)}</option>`).join("")}</select></div><div class="field full"><label>Provider code</label><input id="exportProvider" value="GUSTO"></div><div class="field full"><button class="btn primary" type="submit">Generate CSV Export</button></div></form><div class="notice warn section-gap">The current B-008 contract creates a controlled provider file and audit row only. It does not pretend a Zalaris API transmission exists until a real provider integration is separately registered.</div></div></article><article class="card"><div class="card-head"><div><h2>Export History</h2><p>${ex.length} records</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Export</th><th>Provider</th><th>Status</th><th>Reference</th></tr></thead><tbody>${ex.map(x=>`<tr><td>${esc(x.exportKey)}</td><td>${esc(x.provider)}</td><td><span class="status ${x.status==='SENT'?'good':'warn'}">${esc(x.status)}</span></td><td>${esc(x.providerReference||'—')}</td></tr>`).join("")||`<tr><td colspan="4"><div class="empty"><strong>No exports</strong>No provider export files have been generated.</div></td></tr>`}</tbody></table></div></article></section>`;$("exportForm")?.addEventListener("submit",e=>{e.preventDefault();const runId=$("exportRun").value;if(!runId){toast("Select a finalized run.");return}busy(true);post("PAYROLL_CREATE_EXPORT",{runId,provider:$("exportProvider").value})})}
function renderSuccessFactors(){$("view").innerHTML=`<section class="card"><div class="card-head"><div><h2>SuccessFactors</h2><p>Employee organization source of truth</p></div><button class="btn primary" data-action="open-successfactors">Open SuccessFactors</button></div><div class="card-body"><div class="notice">Use SuccessFactors for country of employment, work location/base, position, manager and system-access assignment. Return to Payroll for compensation, payroll setup and processing.</div></div></section>`}
function wire(){document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.action;if(a==="refresh"){busy(true);post("PAYROLL_REFRESH")}if(a==="open-successfactors")post("PAYROLL_NAVIGATE",{path:"/riaintra/success-factors"});if(a==="create-run"){if(!state.selectedPeriodId){toast("Select a payroll period.");return}busy(true);post("PAYROLL_CREATE_RUN",{periodId:state.selectedPeriodId})}if(a==="finalize-run"){const run=selectedRun();if(!run)return;busy(true);post("PAYROLL_FINALIZE_RUN",{runId:run.id})}}))}
document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));$("menuBtn").addEventListener("click",()=>document.body.classList.toggle("menu-open"));$("scrim").addEventListener("click",()=>document.body.classList.remove("menu-open"));$("globalSearch").addEventListener("input",e=>{state.query=e.target.value;if(state.view==="employees")renderEmployees()});
window.addEventListener("message",event=>{const m=event.data||{};if(m.source!==PARENT_SOURCE)return;if(m.type==="PAYROLL_HOST_READY"){if(!state.workspaceReceived)post("PAYROLL_REFRESH")}else if(m.type==="PAYROLL_WORKSPACE"){state.data=m.payload;state.workspaceReceived=true;busy(false);render()}else if(m.type==="PAYROLL_EXPORT_READY"){busy(false);const p=m.payload||{};if(p.csv){const blob=new Blob([p.csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=p.fileName||"skandi-payroll-export.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Provider export generated and recorded.")}post("PAYROLL_REFRESH")}else if(m.type==="PAYROLL_ERROR"){busy(false);toast(m.payload?.message||"Payroll action failed.")}});
busy(true);post("PAYROLL_READY");
setTimeout(()=>{if(!state.workspaceReceived)post("PAYROLL_REFRESH")},650);
setTimeout(()=>{if(!state.workspaceReceived)post("PAYROLL_REFRESH")},2400);

})();
