name: Resolve Wix booking dependencies

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/resolve-booking-deps.yml'

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/fix-booking-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project dependencies and Wix CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/site-cli" --no-save --ignore-scripts --no-audit --no-fund @wix/cli@1.2.8
      - name: Authenticate Wix CLI
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_CLI_API_KEY"
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" login --api-key "$WIX_CLI_API_KEY"
      - name: Resolve dependencies into Wix lock and metadata
        env:
          npm_config_ignore_scripts: 'true'
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" install --npm
          node -e 'const fs=require("fs"); if(!fs.readFileSync("wix.lock","utf8").includes("@wix/automations")) throw new Error("Wix lock does not contain the booking dependency")'
      - name: Commit generated files and remove temporary workflow
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git rm .github/workflows/resolve-booking-deps.yml
          git add wix.lock dependencies-metadata.json
          git commit -m "Refresh Wix dependency lock and metadata"
          git push origin HEAD:refs/heads/codex/fix-booking-20261109
