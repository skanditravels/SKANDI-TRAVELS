name: SKANDI Website Builder

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'skandi-embeds/**'
      - 'riaintra-embeds/**'
      - 'altea-embeds/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'HTML_REF/**'
      - '.github/workflows/skandi-app-build.yml'
      - '!skandi-embeds/**/*.receiver.html'
      - '!riaintra-embeds/**/*.receiver.html'
      - '!altea-embeds/**/*.receiver.html'
  pull_request:
    branches: [main]
    paths:
      - 'skandi-embeds/**'
      - 'riaintra-embeds/**'
      - 'altea-embeds/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'HTML_REF/**'
      - '.github/workflows/skandi-app-build.yml'
      - '!skandi-embeds/**/*.receiver.html'
      - '!riaintra-embeds/**/*.receiver.html'
      - '!altea-embeds/**/*.receiver.html'

concurrency:
  group: skandi-website-builder-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  queue: max

jobs:
  build:
    if: github.event_name != 'schedule' || vars.SKANDI_WIX_AUTOPUBLISH == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install deterministic compiler tooling
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      - name: Resolve Automation Control Wix dependencies
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 107 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/automation-control-20261113'
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          if [ "$(git log -1 --format=%s)" = "Resolve Wix automation dependencies" ]; then
            echo "The generated dependency lock has already been committed."
            exit 0
          fi
          if [ -z "$WIX_CLI_API_KEY" ]; then
            echo "::error::The repository's Wix CLI credential is not configured for this pull request."
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/site-cli" --no-save --ignore-scripts --no-audit --no-fund @wix/cli@1.2.8
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" login --api-key "$WIX_CLI_API_KEY"
          npm_config_ignore_scripts=true npm_config_audit=false npm_config_fund=false "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" install --npm
          node --test tests/booking-recovery.test.mjs
          git add -- wix.lock dependencies-metadata.json
          if git diff --cached --quiet; then
            echo "The Wix dependency lock is already current."
            exit 0
          fi
          git commit -m "Resolve Wix automation dependencies"
          git push origin HEAD:refs/heads/codex/automation-control-20261113
      - name: Validate route inventory and integration evidence
        run: node scripts/build-skandi-app.mjs --inventory
      - name: Run compilation and regression tests
        id: tests
        run: node --test tests/*.test.mjs
      - name: Compile every complete eligible page
        id: build
        continue-on-error: true
        run: node scripts/build-skandi-app.mjs --fail-on-public
      - name: Report every page and retain validation evidence
        if: always() && steps.build.outcome != 'skipped'
        run: |
          if [ -f dist/website-structure.md ]; then
            cat dist/website-structure.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save build artifacts for review or a protected-branch PR
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: skandi-generated-build
          path: |
            dist/
            **/*.receiver.html
          if-no-files-found: error
      - name: Commit generated output to main
        if: github.event_name != 'pull_request' && steps.tests.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        # The publisher stages dist/ plus only receiver files for pages marked BUILT
        # in the new manifest. Failed page output remains unadvertised and retained.
        run: node scripts/publish-skandi-build.mjs
      - name: Fail visibly when a public SKANDI page failed compilation
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Check pending Wix runtime changes
        if: github.event_name != 'pull_request' && steps.build.outcome == 'success' && vars.SKANDI_WIX_AUTOPUBLISH == 'enabled'
        id: wix_changes
        run: |
          set -euo pipefail
          checkpoint_ref=refs/heads/automation/wix-published
          if git ls-remote --exit-code --heads origin "$checkpoint_ref" >/dev/null; then
            git fetch origin "+$checkpoint_ref:refs/remotes/origin/automation/wix-published"
            checkpoint=refs/remotes/origin/automation/wix-published
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Could not read the Wix deployment checkpoint."
              exit "$status"
            fi
            checkpoint=""
          fi
          needed=$(node scripts/wix-publish-check.mjs "$checkpoint" HEAD)
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Install isolated Wix CLI and site dependencies
        if: steps.wix_changes.outputs.needed == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/site-cli" --no-save --ignore-scripts --no-audit --no-fund @wix/cli@1.2.8
      - name: Check Wix UI version and authenticate
        if: steps.wix_changes.outputs.needed == 'true'
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
          APPROVED_WIX_UI_VERSION: ${{ vars.SKANDI_WIX_UI_VERSION }}
        run: |
          set -euo pipefail
          if [ -z "$WIX_CLI_API_KEY" ] || [ -z "$APPROVED_WIX_UI_VERSION" ]; then
            echo "::error::Wix API key or approved UI version is missing."
            exit 1
          fi
          node -e 'const c=require("./wix.config.json"); if(String(c.uiVersion)!==process.env.APPROVED_WIX_UI_VERSION){console.error("Wix UI version does not match the approved version.");process.exit(1)}'
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" login --api-key "$WIX_CLI_API_KEY"
      - name: Guard the published Wix design
        if: steps.wix_changes.outputs.needed == 'true'
        id: wix_live
        env:
          INITIAL_LIVE_REVISION: ${{ vars.SKANDI_WIX_INITIAL_LIVE_REVISION }}
        run: |
          set -euo pipefail
          checkpoint=refs/remotes/origin/automation/wix-published
          notes_ref=refs/notes/skandi-wix-published
          if git show-ref --verify --quiet "$checkpoint"; then
            git fetch origin "+$notes_ref:$notes_ref"
            deployed=$(git rev-parse "$checkpoint^{commit}")
            git notes --ref="$notes_ref" show "$deployed" > "$RUNNER_TEMP/wix-published-note.json"
            expected=$(node scripts/wix-live-revision.mjs note-expected "$RUNNER_TEMP/wix-published-note.json" "$deployed")
          else
            if git ls-remote --exit-code origin "$notes_ref" >/dev/null; then
              echo "::error::A Wix publication note exists without its source checkpoint; reconcile before publishing."
              exit 1
            else
              status=$?
              if [ "$status" -ne 2 ]; then
                echo "::error::Could not inspect Wix publication notes."
                exit "$status"
              fi
            fi
            expected="$INITIAL_LIVE_REVISION"
          fi
          node scripts/wix-live-revision.mjs check "$expected"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
      - name: Publish tested Wix source
        if: steps.wix_changes.outputs.needed == 'true'
        env:
          EXPECTED_LIVE_REVISION: ${{ steps.wix_live.outputs.expected }}
        run: |
          set -euo pipefail
          current_main=$(git ls-remote --exit-code --heads origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$(git rev-parse HEAD)" ]; then
            echo "::error::main changed after this build was tested; the next run will handle the new commit."
            exit 1
          fi
          node scripts/wix-live-revision.mjs check "$EXPECTED_LIVE_REVISION"
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" publish --source local --approve-preview
      - name: Record successful Wix source deployment
        if: steps.wix_changes.outputs.needed == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          revision=$(node scripts/wix-live-revision.mjs read)
          source_commit=$(git rev-parse HEAD)
          node scripts/wix-live-revision.mjs make-note "$source_commit" "$revision" > "$RUNNER_TEMP/wix-published-note.json"
          git notes --ref=refs/notes/skandi-wix-published add -f -F "$RUNNER_TEMP/wix-published-note.json" "$source_commit"
          git push --atomic origin HEAD:refs/heads/automation/wix-published refs/notes/skandi-wix-published:refs/notes/skandi-wix-published
          echo "Wix CLI reported successful publication of $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
