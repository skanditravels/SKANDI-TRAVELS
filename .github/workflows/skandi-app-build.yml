name: SKANDI Website Builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skandi-embeds/**'
      - 'riaintra-embeds/**'
      - 'altea-embeds/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'HTML_REF/**'
      - '.github/workflows/skandi-app-build.yml'
      - '!skandi-embeds/**/*.receiver.html'
      - '!riaintra-embeds/**/*.receiver.html'
      - '!altea-embeds/**/*.receiver.html'
  pull_request:
    branches: [main]
    paths:
      - 'skandi-embeds/**'
      - 'riaintra-embeds/**'
      - 'altea-embeds/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'HTML_REF/**'
      - '.github/workflows/skandi-app-build.yml'
      - '!skandi-embeds/**/*.receiver.html'
      - '!riaintra-embeds/**/*.receiver.html'
      - '!altea-embeds/**/*.receiver.html'

concurrency:
  group: skandi-website-builder-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install deterministic compiler tooling
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      - name: Inspect Wix site CLI options (draft verification)
        if: github.event_name == 'pull_request'
        run: |
          npm install --prefix "$RUNNER_TEMP/site-cli" --no-save --ignore-scripts --no-audit --no-fund @wix/cli@latest
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" --version
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" publish --help
      - name: Validate route inventory and integration evidence
        run: node scripts/build-skandi-app.mjs --inventory
      - name: Run compilation and regression tests
        id: tests
        run: node --test tests/*.test.mjs
      - name: Compile every complete eligible page
        id: build
        continue-on-error: true
        run: node scripts/build-skandi-app.mjs --fail-on-public
      - name: Report every page and retain validation evidence
        if: always() && steps.build.outcome != 'skipped'
        run: |
          if [ -f dist/website-structure.md ]; then
            cat dist/website-structure.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save build artifacts for review or a protected-branch PR
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: skandi-generated-build
          path: |
            dist/
            **/*.receiver.html
          if-no-files-found: error
      - name: Commit generated output to main
        if: github.event_name != 'pull_request' && steps.tests.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        # The publisher stages dist/ plus only receiver files for pages marked BUILT
        # in the new manifest. Failed page output remains unadvertised and retained.
        run: node scripts/publish-skandi-build.mjs
      - name: Fail visibly when a public SKANDI page failed compilation
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Check whether Wix runtime code changed
        if: github.event_name == 'push' && steps.build.outcome == 'success'
        id: wix_changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}"; then
            echo "::error::Cannot determine the previous commit. Wix publishing is stopped."
            exit 1
          fi
          git diff --no-renames --name-only "$BEFORE_SHA" "$AFTER_SHA" -- src/ > /tmp/skandi-wix-changed-paths
          if awk 'tolower($0) !~ /\.(md|txt)$/ {found=1} END {exit !found}' /tmp/skandi-wix-changed-paths; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Wix after verified build
        if: github.event_name == 'push' && steps.build.outcome == 'success' && steps.wix_changes.outputs.needed == 'true' && vars.SKANDI_WIX_AUTOPUBLISH == 'enabled'
        env:
          WIX_WEBHOOK_URL: ${{ secrets.SKANDI_WIX_PUBLISH_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "$WIX_WEBHOOK_URL" ]; then
            echo "::error::SKANDI_WIX_PUBLISH_WEBHOOK is not configured."
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "::error::main changed during the build. Wix was not published."
            exit 1
          fi
          curl --silent --show-error --fail --max-time 30 \
            --output /dev/null --request POST \
            --header 'Content-Type: application/json' \
            --data '{"source":"github-actions","event":"verified-src-update"}' \
            "$WIX_WEBHOOK_URL"
          echo "Wix accepted the publish trigger. Check its automation log and the live site to verify publication."
