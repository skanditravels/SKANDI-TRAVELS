name: SKANDI Git-built HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tooling under scripts/
        working-directory: scripts
        run: npm install

      - name: Run build-tool tests
        run: node --test tests/build-skandi-app.test.mjs

      - name: Build the Git-rendered flight-status page
        run: node scripts/build-skandi-app.mjs

      - name: Commit generated HTML back to Git
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- dist/flight-status/index.html
          if git diff --cached --quiet -- dist/flight-status/index.html; then
            echo "No generated HTML changes to commit."
            exit 0
          fi
          git commit -m "Build SKANDI flight-status page"
          git push origin HEAD:main
