name: Wix preview validation

on:
  pull_request:
    paths:
      - '.github/workflows/wix-preview-validation.yml'

permissions:
  contents: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/verify-published-wix-design-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the observed live design revision
        run: node scripts/wix-live-revision.mjs check 1590
      - name: Use the observed published snapshot for this preview only
        run: |
          node -e 'const fs=require("fs"); const p="wix.config.json"; const c=JSON.parse(fs.readFileSync(p,"utf8")); c.uiVersion="1590"; fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
      - name: Install dependencies and Wix CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/site-cli" --no-save --ignore-scripts --no-audit --no-fund @wix/cli@1.2.8
      - name: Authenticate
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_CLI_API_KEY"
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" login --api-key "$WIX_CLI_API_KEY"
      - name: Check checkpoint push permissions without changing any refs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git notes --ref=refs/notes/skandi-wix-published add -m validation HEAD
          git push --atomic --dry-run origin HEAD:refs/heads/automation/wix-published refs/notes/skandi-wix-published:refs/notes/skandi-wix-published
      - name: Preview without publishing
        run: |
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" preview --source local
