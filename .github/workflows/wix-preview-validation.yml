name: Wix preview validation

on:
  pull_request:
    paths:
      - '.github/workflows/wix-preview-validation.yml'

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/wix-preview-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies and Wix site CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/site-cli" --no-save --ignore-scripts --no-audit --no-fund @wix/cli@1.2.8
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" preview --help
      - name: Authenticate without displaying the key
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_CLI_API_KEY"
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" login --api-key "$WIX_CLI_API_KEY"
      - name: Build a non-production preview
        run: |
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" preview --source local
