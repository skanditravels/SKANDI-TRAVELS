name: Wix preview validation

on:
  pull_request:
    paths:
      - '.github/workflows/wix-preview-validation.yml'

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/wix-preview-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies and Wix site CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/site-cli" --no-save --ignore-scripts --no-audit --no-fund @wix/cli@1.2.8
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" --help
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" dev --help
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" preview --help
      - name: Authenticate without displaying the key
        env:
          WIX_CLI_API_KEY: ${{ secrets.WIX_CLI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_CLI_API_KEY"
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" login --api-key "$WIX_CLI_API_KEY"
      - name: Inspect Wix editor synchronization in a disposable checkout
        run: |
          set -euo pipefail
          timeout 35s "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" dev --tunnel > "$RUNNER_TEMP/wix-dev.log" 2>&1 || true
          node -e 'const f=require("fs");const s=f.readFileSync(process.env.RUNNER_TEMP+"/wix-dev.log","utf8"); console.log("Revision missing:",s.includes("REVISION_NOT_FOUND")); console.log("Tunnel error:",/error|failed/i.test(s)); console.log("Editor URL advertised:",/https?:/i.test(s));const c=JSON.parse(f.readFileSync("wix.config.json"));console.log("Resulting UI version:",c.uiVersion)'
      - name: Test the last published Wix history revision in an isolated preview
        run: |
          node -e 'const fs=require("fs");const p="wix.config.json";const c=JSON.parse(fs.readFileSync(p));c.uiVersion="1582";fs.writeFileSync(p,JSON.stringify(c,null,2))'
      - name: Build a non-production preview
        run: |
          "$RUNNER_TEMP/site-cli/node_modules/.bin/wix" preview --source local
