name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fix: Switched from 'npm ci' to 'npm install' since there is no lockfile committed
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run Code Linter
        run: npm run lint
