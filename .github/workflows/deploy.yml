name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fix: Added --ignore-scripts to completely skip the crashing Wix postinstall routine
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Replaced migrate with lint since that's defined in your package.json
      - name: Run Code Linter
        run: npm run lint
