name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Prevents Node 20 deprecation warning

      # Fix: Disable interactive prompt behaviors during dependency installations
      - name: Install dependencies
        env:
          CI: true
        run: npm ci --foreground-scripts=false

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: npm run migrate
